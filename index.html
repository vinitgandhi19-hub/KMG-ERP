      sup.plantContactName=f.plantContactName||''; sup.plantContactNumber=f.plantContactNumber||''; sup.plantContactEmail=f.plantContactEmail||'';
      sup.qcContactName=f.qcContactName||''; sup.qcContactNumber=f.qcContactNumber||''; sup.qcContactEmail=f.qcContactEmail||'';
      sup.paymentTerms=f.paymentTerms||'';
      sup.reelsDepositFeeApplicable = f.reelsDepositFeeApplicable==='yes';
      sup.reelMakes = f.reelsDepositFeeApplicable==='yes' ? readReelMakesFromDom() : [];
      sup.packagingSheetDepositApplicable = f.packagingSheetDepositApplicable==='yes';
      sup.packagingSheetPrice = f.packagingSheetDepositApplicable==='yes' && f.packagingSheetPrice ? Number(f.packagingSheetPrice) : null;
    } // else: this user's form never showed these fields — leave the existing values untouched
    try{ await saveClients(); }
    catch(e){
      Object.assign(sup, previous);
      throw new Error('Could not save the Client — check your internet connection and try again.');
    }
    state.modal=null; showToast('Client updated.'); render();
  }

  // Saves the single Production Pass row currently open for inline editing — reads straight from
  // the DOM inputs by ID (there's no separate form to submit, since this happens directly inside
  // the table). Handles both a brand-new pass and an edit of an existing one, depending on
  // whether passId is 'new' or a real ID.
  async function saveProductionPassInline(itemKeyAndPassId){
    const [orderId, itemId, passId] = itemKeyAndPassId.split('|');
    const order = state.orders.find(o=>o.id===orderId);
    const wo = order?.items.find(i=>i.id===itemId);
    if(!wo){ showToast('Item not found.'); return; }
    const val = (id)=> document.getElementById(id).value;
    const fields = {
      inputSize: val('passInputSize')||'', type: val('passType')||'', mcNo: val('passMcNo')||'',
      dieSize: val('passDieSize')||'', sizeTolerance: val('passSizeTolerance')||'',
      qtyKM: val('passQtyKM') ? Number(val('passQtyKM')) : null,
      noOfReels: val('passNoOfReels') ? Number(val('passNoOfReels')) : null,
      remarks: val('passRemarks')||'',
    };
    if(!wo.productionPasses) wo.productionPasses = [];
    if(passId==='new'){
      const pass = mkProductionPass({...fields, createdBy: currentUser().fullName});
      wo.productionPasses.push(pass);
      logOrderAudit(order, `Production pass recorded on ${wo.itemSerialNo}`);
      try{ await saveOrder(order.id); }
      catch(e){
        wo.productionPasses = wo.productionPasses.filter(p=>p.id!==pass.id);
        showToast(e.message || 'Could not save — please try again.');
        return;
      }
      showToast('Pass added.');
    } else {
      const pass = wo.productionPasses.find(p=>p.id===passId);
      if(!pass){ showToast('Pass not found.'); return; }
      const previous = {...pass};
      Object.assign(pass, fields);
      try{ await saveOrder(order.id); }
      catch(e){
        Object.assign(pass, previous);
        showToast(e.message || 'Could not save — please try again.');
        return;
      }
      showToast('Pass updated.');
    }
    editingPassRow = null;
    render();
  }

  async function submitCreatePO(){

    if(!pr) throw new Error('Purchase Requisition not found.');
    if(pr.status!=='Approved') throw new Error('This requisition is not yet approved by the MD.');

    if(!f.itemName) throw new Error('Item Name is required.');
    if(!f.quantity || !f.rate) throw new Error('Quantity and Rate are required.');
    const po = mkPurchaseOrder({
      prId:pr.id, prNo:pr.prNo,

    catch(e){
      state.purchaseOrders = state.purchaseOrders.filter(x=>x.id!==po.id);

    po.expectedDeliveryDate=f.expectedDeliveryDate||''; po.remarks=f.remarks||'';

  async function submitEditSalesOrder(){
    const so = state.salesOrders.find(x=>x.id===state.modal.soId);
    if(!so) throw new Error('Sales Order not found.');
    if(so.status!=='Draft') throw new Error('This Sales Order has already been sent for Work Order and can no longer be edited.');
    const sf = readSOFieldsFromForm();
    if(!sf.customer) throw new Error('Customer Name is required.');
    const previous = {customer:so.customer, poNumber:so.poNumber, poDate:so.poDate, paymentTerms:so.paymentTerms, reelsDepositFeeApplicable:so.reelsDepositFeeApplicable, reelMakes:so.reelMakes, packagingSheetDepositApplicable:so.packagingSheetDepositApplicable, packagingSheetPrice:so.packagingSheetPrice, items:so.items};
    Object.assign(so, sf);
    so.items = draftSOItems;
    try{
      await saveSalesOrders();
    }catch(e){
      Object.assign(so, previous);
      throw new Error('Could not save the Sales Order — check your internet connection and try again.');
    }
    draftSOItems = []; draftSOFields = {customer:'',poNumber:'',poDate:'',paymentTerms:'',reelsDepositFeeApplicable:false,reelMakes:[],packagingSheetDepositApplicable:false,packagingSheetPrice:null};
    state.modal=null; showToast('Sales Order updated.'); render();
  }
  // "Send for Work Order" is the one-way handoff from commercial terms to production: it creates
  // a real Work Order carrying the same number sequence (SO-0801 -> WO-0801) so the two stay
  // permanently, visibly linked, then locks the Sales Order from further editing. Each Sales
  // Order item carries over as a real Work Order item — the 5 fields Sales fills in (Product
  // Type, Process Type, Wire/Size, Grade, Rate) are pre-filled; everything else (quantities,
  // QC ranges, packaging) is left for the Work Order person to complete via Edit Item.
  // Each Sales Order item generates its own Work Order — WO-0801-1, WO-0801-2, etc., one per
  // item — since each item now carries its own independent production log (the die-size/pass
  // sub-table). A Sales Order with no items yet still gets a single plain WO-0801, letting
  // Production add items to it manually, matching how this worked before items existed on the
  // Sales Order at all. If any one Work Order fails to save, every Work Order from this batch is
  // rolled back together — never a partial set where only some of an order's items got created.
  async function sendSalesOrderForWorkOrder(soId){
    const so = state.salesOrders.find(x=>x.id===soId);
    if(!so || so.status!=='Draft') return;
    const baseWoId = 'WO-'+so.id.slice(3);
    const soItems = so.items||[];
    const newOrders = soItems.length===0
      ? [ mkOrder({id:baseWoId, customer:so.customer, poNumber:so.poNumber, remarks:'', createdBy:currentUser().fullName, salesOrderId:so.id, items:[]}) ]
      : soItems.map((soIt,idx)=>{
          const woId = baseWoId+'-'+(idx+1);
          const item = mkItem({
            itemSerialNo: generateItemSerial(so.poNumber),
            productType: soIt.productType, processType: soIt.processType,
            wireSize: soIt.wireSize, numWires: soIt.numWires, productGrade: soIt.productGrade,
            rate: soIt.rate, orderQty: 0, createdBy: currentUser().fullName,
          });
          const order = mkOrder({id:woId, customer:so.customer, poNumber:so.poNumber, remarks:'', createdBy:currentUser().fullName, salesOrderId:so.id, items:[item]});
          logOrderAudit(order, `Work Order created from Sales Order ${so.id}, item ${idx+1} of ${soItems.length}`);
          return order;
        });
    newOrders.forEach(o=> state.orders.push(o));
    try{
      for(const o of newOrders) await saveOrder(o.id, true);
    }catch(e){
      const newIds = new Set(newOrders.map(o=>o.id));
      state.orders = state.orders.filter(o=>!newIds.has(o.id));
      showToast(e.message || 'Could not create the Work Order(s) — please try again.');
      render();
      return;
    }
    so.status = 'Sent to Work Order';
    so.workOrderIds = newOrders.map(o=>o.id);
    try{
      await saveSalesOrders();
    }catch(e){
      showToast(`Work Order(s) ${so.workOrderIds.join(', ')} were created, but updating the Sales Order record failed — please reload and confirm its status.`);
      render();
      return;
    }
    showToast(`Sent for Work Order — ${newOrders.length>1?newOrders.length+' Work Orders created':so.workOrderIds[0]+' created'}.`);
    render();
  }

  async function submitCreatePR(){
    const f = readForm('formCreatePR');
    const itemCodeRequired = currentUser().role === 'PurchaseDepartment';
    if(!f.itemName || !f.reqQty) throw new Error('Please fill all required fields.');
    if(itemCodeRequired && !f.itemCode) throw new Error('Item Code is required.');
    const newPR = {
      id:uid('PR'), prNo:nextPRNumber(), date:today(), itemCode:f.itemCode||'', itemName:f.itemName, reqQty:f.reqQty,
      machine:f.machine||'', dimension:f.dimension||'', photos: pendingPRPhotos.slice(), remarks:f.remarks||'', createdBy: currentUser().fullName, createdAt:nowIso(),
      client:'', estPrice:null, deliveryDays:null, paymentTerms:'', purchaseRemarks:'', purchaseActionBy:'', purchaseActionAt:'',
      status:'Pending Purchase Action', approvedBy:'', approvalAt:'', approvalRemarks:'',
    };
    state.purchase.push(newPR);
    try{ await savePR(); }
    catch(e){
      state.purchase = state.purchase.filter(x=>x.id!==newPR.id);
      throw new Error('Could not save — check your internet connection and try again.');
    }
    state.modal=null; pendingPRPhotos=[]; showToast('Purchase requisition raised.'); render();
  }

  async function submitPurchaseAction(){
    const pr = state.purchase.find(p=>p.id===state.modal.prId);

    pr.itemCode = f.itemCode; pr.itemName = f.itemName;
    pr.client = f.client||''; pr.estPrice = Number(f.estPrice); pr.deliveryDays = Number(f.deliveryDays); pr.paymentTerms = f.paymentTerms||'';
    pr.purchaseRemarks = f.purchaseRemarks||''; pr.purchaseActionBy = currentUser().fullName; pr.purchaseActionAt = nowIso();
    pr.status = 'Pending MD Approval'; pr.approvalRemarks='';

      throw new Error('Could not save — check your internet connection and try again.');

  async function submitUserForm(isEdit){
    const f = readForm('formUser');
    if(!f.fullName || !f.username || !f.role) throw new Error('Please fill all required fields.');
    if(!isEdit){
      if(!f.password || f.password!==f.confirmPassword) throw new Error('Passwords do not match.');
      if(state.users.some(u=>u.username.toLowerCase()===f.username.toLowerCase())) throw new Error('That username is already taken.');
    }
    // Multi-select values don't survive the generic FormData flattening in readForm (it only keeps
    // the last value per key), so read the selected <option>s directly for sections.
    const sectionsSelectEl = document.querySelector('#formUser select[name="sections"]');
    const sections = sectionsSelectEl ? [...sectionsSelectEl.selectedOptions].map(o=>o.value) : [];
    if(f.role==='ProductionManager' && sections.length===0) throw new Error('Please select at least one section for Production Supervisor.');
    if(isEdit){
      const u = state.users.find(x=>x.id===state.modal.userId);
      u.fullName=f.fullName; u.employeeCode=f.employeeCode||''; u.mobile=f.mobile||''; u.email=f.email||''; u.role=f.role;
      u.sections = f.role==='ProductionManager' ? sections : [];
      delete u.section; // superseded by sections[]; drop the legacy single-value field
      u.status=f.status;
    } else {
      state.users.push({id:uid('U'), fullName:f.fullName, employeeCode:f.employeeCode||'', username:f.username, password:f.password, mobile:f.mobile||'', email:f.email||'', role:f.role, sections: f.role==='ProductionManager'?sections:[], status:f.status||'Active', createdAt:nowIso()});
    }
    await saveUsers(); state.modal=null; showToast(isEdit?'User updated.':'User created.'); render();
  }

  async function submitResetPw(){
    const f = readForm('formResetPw');
    if(!f.password || f.password!==f.confirmPassword) throw new Error('Passwords do not match.');
    const u = state.users.find(x=>x.id===state.modal.userId);
    u.password = f.password;
    await saveUsers(); state.modal=null; showToast('Password reset for '+u.fullName+'.'); render();
  }

  async function submitChangeMyPassword(){
    const f = readForm('formChangeMyPassword');
    const u = currentUser();
    if(!u) throw new Error('No user is signed in.');
    if(f.currentPassword !== u.password) throw new Error('Current password is incorrect.');
    if(!f.newPassword || f.newPassword.length < 4) throw new Error('New password must be at least 4 characters.');
    if(f.newPassword !== f.confirmNewPassword) throw new Error('New passwords do not match.');
    u.password = f.newPassword;
    await saveUsers(); state.modal=null; showToast('Password changed.'); render();
  }

  async function submitCustomerRejection(action){
    const {order, item:wo} = findItem(state.modal.itemKey);
    if(!wo) throw new Error('Item not found.');
    const f = readForm('formCustReject');
    const qty = Number(f.qty);
    if(!qty || qty<=0) throw new Error('Enter a valid rejected quantity.');
    if(!f.remarks) throw new Error('Enter remarks for the customer rejection.');
    const d = deriveItem(wo);
    if(qty > d.netDispatched + 1e-9) throw new Error(`Rejected quantity cannot exceed the ${round1(d.netDispatched)} kg currently recorded as delivered to the customer.`);
    const prevStatus = deriveItemStatus(wo);
    wo.customerRejections.push({id:uid('CR'), qty, remarks:f.remarks, action, timestamp:nowIso(), by:currentUser().fullName});
    if(action==='Close'){ wo.closed = true; }
    const newStatus = deriveItemStatus(wo);
    logItemActivity(wo, 'Customer Rejection: '+action, prevStatus, newStatus, qty, currentUser().fullName, f.remarks||'');
    logOrderAudit(order, `Customer rejection recorded on ${wo.itemSerialNo} (${qty} kg) — ${action}`);
    await saveOrder(order.id); state.modal=null;
    showToast(action==='Reproduction'
      ? `Customer rejection recorded (${qty} kg) — sent back to Production Ongoing.`
      : `Customer rejection recorded (${qty} kg) — item closed.`);
    render();
  }


  /* ================= INIT ================= */
  loadAll();

})();
