<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KMG Wiring Solutions — Production &amp; QC ERP</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="KMG ERP">
<meta name="theme-color" content="#077B8E">

<style>
  @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

  :root{
    --brand:#077B8E; --brand-dark:#0A3E47; --brand-hover:#065F6E; --brand-tint:#B9E1E6; --brand-tint-dark:#8FD0DA;
    --statusblue:#3B5B8C;
    --ink:#3A3A3C; --ink-soft:#6E7071; --paper:#EEF2F2; --panel:#FFFFFF; --line:#DAE1E0;
    --amber:#B9821B; --amber-bg:#FBF1DC; --green:#2E7A56; --green-bg:#E1F0E7;
    --red:#A63B32; --red-bg:#F7E3E0; --blue-bg:#E4EBF1; --purple:#6A4E9C; --purple-bg:#EFEAF6;
    --radius:6px; --shadow:0 1px 2px rgba(22,27,32,.06), 0 4px 14px rgba(22,27,32,.05);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  html{overflow-x:hidden;}
  body{margin:0; background:var(--paper); color:var(--ink); font-family:'Inter',sans-serif; font-size:12.5px; line-height:1.35; -webkit-font-smoothing:antialiased; overflow-x:hidden;}
  #root{display:flex; min-height:100vh;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  h1,h2,h3,.disp{font-family:'Barlow Condensed',sans-serif; text-transform:uppercase; letter-spacing:.03em; color:var(--ink);}
  ::selection{background:var(--brand-tint-dark);}

  .sidebar{width:184px; flex:0 0 184px; background:var(--brand-dark); color:#DCE4E9; display:flex; flex-direction:column; padding:12px 0;}
  .brand{padding:0 16px 12px; border-bottom:1px solid rgba(255,255,255,.12); margin-bottom:10px; display:flex; align-items:center; justify-content:center;}
  .brand img{width:100%; max-width:150px; height:auto; display:block;}
  .nav{display:flex; flex-direction:column; gap:1px; padding:0 8px;}
  .nav-item{display:flex; align-items:center; gap:8px; padding:6px 10px; border-radius:4px; color:#B7C4CC; font-size:11.5px; font-weight:500; cursor:pointer; border:none; background:none; text-align:left; width:100%;}
  .nav-item svg{flex:0 0 14px; width:14px; height:14px; opacity:.85;}
  .nav-item:hover{background:rgba(255,255,255,.06); color:#fff;}
  .nav-item.active{background:var(--brand); color:#fff;}
  .nav-item.active svg{opacity:1;}
  .nav-divider{height:1px; background:rgba(255,255,255,.1); margin:8px 16px;}
  .sidebar-foot{margin-top:auto; padding:10px 14px 2px; border-top:1px solid rgba(255,255,255,.1);}
  .role-label{font-size:9px; text-transform:uppercase; letter-spacing:.08em; color:#7F929C; margin-bottom:3px;}
  .role-tag{font-size:9.5px; color:var(--brand-tint-dark); margin-top:4px; font-family:'IBM Plex Mono',monospace;}
  .logout-btn{width:100%; margin-top:7px; background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.15); color:#DCE4E9; padding:5px 7px; border-radius:4px; font-size:10.5px; font-weight:600; cursor:pointer; font-family:'Inter',sans-serif;}
  .logout-btn:hover{background:rgba(255,255,255,.14); color:#fff;}

  /* ---------- Login screen ---------- */
  .login-wrap{min-height:100vh; width:100%; flex:1 1 100%; display:flex; align-items:center; justify-content:center; background:radial-gradient(circle at 30% 20%, #0E4A55 0%, var(--brand-dark) 55%, #06262B 100%); padding:20px; box-sizing:border-box;}
  .login-card{background:var(--panel); width:100%; max-width:400px; border-radius:10px; box-shadow:0 24px 60px rgba(0,0,0,.35); overflow:hidden;}
  .login-brand{padding:34px 30px 18px; display:flex; flex-direction:column; align-items:center; border-bottom:1px solid var(--line);}
  .login-brand img{width:190px; height:auto; margin-bottom:6px;}
  .login-brand .tag{font-size:11px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.08em; font-family:'IBM Plex Mono',monospace;}
  .login-body{padding:26px 30px 30px;}
  .login-body h2{font-size:20px; margin:0 0 4px; text-align:center;}
  .login-body .sub{font-size:12.5px; color:var(--ink-soft); text-align:center; margin-bottom:22px;}
  .pw-field{position:relative;}
  .pw-toggle{position:absolute; right:9px; top:50%; transform:translateY(-50%); background:none; border:none; color:var(--ink-soft); font-size:11.5px; font-weight:600; cursor:pointer; padding:4px 6px; font-family:'Inter',sans-serif;}
  .pw-toggle:hover{color:var(--brand);}
  .login-btn{width:100%; margin-top:6px; background:var(--brand); border:1px solid var(--brand); color:#fff; padding:11px; border-radius:6px; font-size:14px; font-weight:700; cursor:pointer; font-family:'Inter',sans-serif;}
  .login-btn:hover{background:var(--brand-hover);}
  .login-hint{margin-top:18px; padding-top:16px; border-top:1px dashed var(--line); font-size:11.5px; color:var(--ink-soft); line-height:1.6;}
  .login-hint b{color:var(--ink); font-family:'IBM Plex Mono',monospace;}


  .main{flex:1; min-width:0; display:flex; flex-direction:column;}
  .topbar{display:flex; align-items:center; justify-content:space-between; padding:9px 18px; border-bottom:1px solid var(--line); background:var(--panel);}
  .topbar h1{font-size:18px; margin:0; font-weight:800;}
  .topbar .meta{font-size:10px; color:var(--ink-soft); font-family:'IBM Plex Mono',monospace; margin-top:1px;}
  .content{padding:12px 16px 30px; overflow-y:auto; overflow-x:hidden; max-width:100%;}
  .topbar-logo{height:28px; width:auto; display:block;}

  .btn{display:inline-flex; align-items:center; gap:5px; border:1px solid var(--line); background:#fff; color:var(--ink); padding:5px 10px; border-radius:4px; font-size:11px; font-weight:600; cursor:pointer; white-space:nowrap; font-family:'Inter',sans-serif;}
  .btn:hover{border-color:var(--brand);}
  .btn-primary{background:var(--brand); border-color:var(--brand); color:#fff;}
  .btn-primary:hover{background:var(--brand-hover);}
  .btn-steel{background:var(--ink); border-color:var(--ink); color:#fff;}
  .btn-steel:hover{background:#1F1F21;}
  .btn-red{background:var(--red); border-color:var(--red); color:#fff;}
  .btn-ghost{background:transparent; border-color:transparent; color:var(--brand); padding:5px 5px;}
  .btn:disabled{opacity:.4; cursor:not-allowed;}
  .btn-sm{padding:3px 7px; font-size:10px;}

  .kpi-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-bottom:14px;}
  .notif-bell-wrap{position:relative;}
  .notif-badge{position:absolute; top:-4px; right:-4px; background:var(--red); color:#fff; font-size:10px; font-weight:700; border-radius:10px; padding:1px 5px; line-height:1.4; min-width:15px; text-align:center;}
  .notif-panel{position:absolute; top:calc(100% + 8px); right:0; width:340px; max-height:440px; overflow-y:auto; background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); box-shadow:0 8px 28px rgba(20,24,28,.18); z-index:60;}
  .notif-panel-head{padding:8px 12px; font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-soft); border-bottom:1px solid var(--line); background:#F7F8F7; position:sticky; top:0;}
  .notif-item{padding:8px 12px; border-bottom:1px solid var(--line); cursor:pointer;}
  .notif-item:last-child{border-bottom:none;}
  .notif-item:hover{background:#F8F5F1;}
  .notif-item.unread{background:#FBF3EA;}
  .notif-dot{width:7px; height:7px; border-radius:50%; background:var(--brand); flex-shrink:0; margin-top:3px;}
  .kpi{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:8px 10px; box-shadow:var(--shadow); cursor:pointer; transition:border-color .12s;}
  .kpi:hover{border-color:var(--brand);}
  .kpi .n{font-family:'IBM Plex Mono',monospace; font-size:19px; font-weight:600; color:var(--ink);}
  .kpi .l{font-size:9.5px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.04em; margin-top:1px;}
  .kpi.flag .n{color:var(--red);} .kpi.warn .n{color:var(--amber);} .kpi.ok .n{color:var(--green);}

  .panel{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow);}
  .panel-head{display:flex; align-items:center; justify-content:space-between; padding:8px 12px; border-bottom:1px solid var(--line);}
  .panel-head h2{font-size:14px; margin:0;}
  .panel-body{padding:8px 10px;}
  .section-gap{margin-bottom:14px;}

  table{width:100%; border-collapse:collapse;}
  .table-scroll{width:100%; overflow-x:auto; -webkit-overflow-scrolling:touch; border-radius:4px;}
  th{text-align:center; font-size:9px; text-transform:uppercase; letter-spacing:.01em; color:var(--ink-soft); padding:3px 4px; border-bottom:1px solid var(--line); background:#F7F8F7; line-height:1.1;}
  td{text-align:center; padding:2px 4px; border-bottom:1px solid var(--line); font-size:10.5px; vertical-align:middle; line-height:1.15;}
  tr:last-child td{border-bottom:none;}
  tr.clickable{cursor:pointer;}
  tr.clickable:hover{background:#F8F5F1;}

  .pill{display:inline-flex; align-items:center; gap:4px; padding:2px 7px; border-radius:20px; font-size:10px; font-weight:600; font-family:'IBM Plex Mono',monospace; white-space:nowrap;}
  .pill-status{white-space:normal; max-width:46px; text-align:center; line-height:1.2; padding:1px 5px;}
  .pill-dot{width:5px; height:5px; border-radius:50%;}
  .pill.pending{background:var(--amber-bg); color:var(--amber);} .pill.pending .pill-dot{background:var(--amber);}
  .pill.ongoing{background:var(--blue-bg); color:var(--statusblue);} .pill.ongoing .pill-dot{background:var(--statusblue);}
  .pill.ready{background:var(--purple-bg); color:var(--purple);} .pill.ready .pill-dot{background:var(--purple);}
  .pill.partial{background:var(--amber-bg); color:#8A5A15;} .pill.partial .pill-dot{background:#8A5A15;}
  .pill.complete{background:var(--green-bg); color:var(--green);} .pill.complete .pill-dot{background:var(--green);}
  .pill.rejected{background:var(--red-bg); color:var(--red);} .pill.rejected .pill-dot{background:var(--red);}
  .pill.inactive{background:#EDEBE6; color:#7A7568;} .pill.inactive .pill-dot{background:#7A7568;}
  .flag-repeat{color:var(--red); font-size:10px; font-weight:700; display:inline-flex; align-items:center; gap:3px;}
  .flag-delay{color:var(--amber); font-size:10px; font-weight:700; display:inline-flex; align-items:center; gap:3px;}

  .spool-wrap{display:flex; align-items:center; gap:8px;}
  .spool-wrap .pct{font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--ink-soft);}

  .empty{padding:28px 16px; text-align:center; color:var(--ink-soft);}
  .empty .disp{font-size:17px; color:var(--ink); margin-bottom:5px;}

  .form-grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(150px,1fr)); gap:8px 12px;}
  .form-grid-compact{display:grid; grid-template-columns:repeat(auto-fit, minmax(115px,1fr)); gap:6px 8px;}
  .form-grid-compact .field label{font-size:9px; margin-bottom:2px; display:block;}
  .form-grid-compact .field input, .form-grid-compact .field select{font-size:11px; padding:4px 6px; width:100%;}
  .range-pair{display:flex; align-items:center; gap:4px;}
  .range-pair input{min-width:0;}
  .range-pair span{color:var(--ink-soft); font-size:10px;}
  .field{display:flex; flex-direction:column; gap:3px;}
  .field.full{grid-column:1/-1;}
  .field label{font-size:9.5px; font-weight:600; text-transform:uppercase; letter-spacing:.03em; color:var(--ink-soft);}
  .field .hint{font-size:9.5px; color:var(--ink-soft); font-weight:400; text-transform:none; letter-spacing:0;}
  input,select,textarea{font-family:'Inter',sans-serif; font-size:12px; padding:5px 7px; border:1px solid var(--line); border-radius:4px; background:#fff; color:var(--ink); width:100%;}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--brand); outline-offset:0; border-color:var(--brand);}
  textarea{resize:vertical; min-height:44px;}
  input:disabled,select:disabled{background:#F3F3F1; color:#9A9A92;}
  .error-box{background:var(--red-bg); color:var(--red); border:1px solid #E3B7B1; padding:7px 10px; border-radius:4px; font-size:11.5px; margin-bottom:9px; font-weight:500;}
  .note-box{background:var(--blue-bg); color:var(--brand-dark); border:1px solid #C4D3DD; padding:7px 10px; border-radius:4px; font-size:11px; margin-bottom:10px;}
  .warn-box{background:var(--amber-bg); color:#7A5410; border:1px solid #E7CE9C; padding:7px 10px; border-radius:4px; font-size:11px; margin-bottom:10px;}
  fieldset{border:1px dashed var(--line); border-radius:6px; padding:10px; margin:0;}
  legend{font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--brand); padding:0 5px;}

  .modal-backdrop{position:fixed; inset:0; background:rgba(20,24,28,.5); display:flex; align-items:flex-start; justify-content:center; padding:30px 20px; overflow-y:auto; z-index:50;}
  .modal{background:#fff; border-radius:8px; width:100%; max-width:920px; max-height:calc(100vh - 30px); overflow-y:auto; box-shadow:0 20px 50px rgba(0,0,0,.25); margin-bottom:30px; box-sizing:border-box;}
  .modal-head{display:flex; align-items:center; justify-content:space-between; padding:10px 14px; border-bottom:1px solid var(--line);}
  .modal-head h2{margin:0; font-size:15px;}
  .modal-body{padding:12px 14px;}
  .modal-foot{display:flex; justify-content:flex-end; gap:6px; padding:9px 14px; border-top:1px solid var(--line); flex-wrap:wrap;}
  .x-btn{background:none; border:none; font-size:18px; color:var(--ink-soft); cursor:pointer; line-height:1; padding:2px 6px;}

  .drawer-backdrop{position:fixed; inset:0; background:rgba(20,24,28,.45); z-index:40;}
  .drawer{position:fixed; top:0; right:0; bottom:0; width:640px; max-width:94vw; background:#fff; box-shadow:-8px 0 30px rgba(0,0,0,.18); z-index:41; overflow-y:auto;}
  .drawer-head{padding:12px 16px; border-bottom:1px solid var(--line); position:sticky; top:0; background:#fff; z-index:2;}
  .drawer-head .wo-id{font-family:'IBM Plex Mono',monospace; font-size:10px; color:var(--brand); letter-spacing:.04em;}
  .drawer-head h2{margin:3px 0 0; font-size:18px;}
  .drawer-body{padding:12px 16px;}
  .spec-grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(135px,1fr)); gap:6px 14px; margin-bottom:12px;}
  .spec-item .k{font-size:9.5px; text-transform:uppercase; color:var(--ink-soft); letter-spacing:.03em;}
  .spec-item .v{font-family:'IBM Plex Mono',monospace; font-size:12px; margin-top:0;}
  .log-block{margin-bottom:13px;}
  .log-block h3{font-size:11.5px; margin:0 0 5px; text-transform:uppercase; letter-spacing:.03em; color:var(--ink-soft); font-family:'Inter',sans-serif; font-weight:700;}
  .log-empty{font-size:11px; color:var(--ink-soft); padding:6px 0;}
  .qty-bar-track{height:7px; background:#EDEBE6; border-radius:4px; overflow:hidden; display:flex;}
  .qty-bar-seg{height:100%;}
  .qty-legend{display:flex; gap:11px; margin-top:5px; font-size:10px; color:var(--ink-soft); flex-wrap:wrap;}
  .qty-legend span{display:inline-flex; align-items:center; gap:4px;}
  .dot{width:7px; height:7px; border-radius:2px; display:inline-block;}
  .audit{font-size:10px; color:var(--ink-soft); margin-top:2px;}

  .stage-track{display:flex; align-items:center; gap:0; margin-bottom:13px;}
  .stage{flex:1; text-align:center; position:relative; padding-bottom:6px;}
  .stage .dotc{width:19px; height:19px; border-radius:50%; background:#E6E4DE; color:#8A867C; display:flex; align-items:center; justify-content:center; margin:0 auto 4px; font-size:10px; font-weight:700; font-family:'IBM Plex Mono',monospace;}
  .stage.done .dotc{background:var(--green); color:#fff;}
  .stage.current .dotc{background:var(--brand); color:#fff;}
  .stage .lbl{font-size:9px; text-transform:uppercase; letter-spacing:.03em; color:var(--ink-soft);}
  .stage:not(:last-child)::after{content:''; position:absolute; top:9px; left:60%; right:-40%; height:2px; background:#E6E4DE;}
  .stage.done:not(:last-child)::after{background:var(--green);}

  .photo-grid{display:flex; gap:6px; flex-wrap:wrap; margin-top:6px;}
  .photo-thumb{width:52px; height:52px; border-radius:5px; object-fit:cover; border:1px solid var(--line);}
  .photo-add{width:52px; height:52px; border-radius:5px; border:1px dashed var(--line); display:flex; align-items:center; justify-content:center; font-size:10px; color:var(--ink-soft); cursor:pointer; background:#FAFAF8; flex-direction:column; gap:2px; text-align:center;}

  .toast{position:fixed; bottom:22px; left:50%; transform:translateX(-50%); background:var(--ink); color:#fff; padding:9px 16px; border-radius:6px; font-size:12px; z-index:80; box-shadow:0 6px 20px rgba(0,0,0,.25); max-width:80vw;}
  @media (max-width:900px){
    .form-grid{grid-template-columns:1fr 1fr;} .kpi-grid{grid-template-columns:repeat(2,1fr);}
    .sidebar{width:64px; flex-basis:64px;} .brand .disp,.brand .sub,.nav-item span,.sidebar-foot{display:none;} .nav-item{justify-content:center;}
  }
  @media (max-width:480px){
    .form-grid{grid-template-columns:1fr;}
    .kpi-grid{grid-template-columns:1fr;}
    .content{padding:10px 8px 24px;}
    .topbar{padding:8px 10px; flex-wrap:wrap; gap:6px;}
    .panel-body{padding:8px;}
    .login-wrap{padding:12px;}
    .login-brand{padding:24px 18px 14px;}
    .login-body{padding:18px;}
    .modal-body, .modal-head, .modal-foot{padding-left:10px; padding-right:10px;}
  }
</style>
</head>
<body>

<div id="root"></div>

  /* ================= ZIP WRITER (self-contained, no external library) =================
     Minimal ZIP (STORE / no compression) writer — used for building .docx and .xlsx files

  const CRC_TABLE = (function(){
    const t = new Uint32Array(256);
    for(let n=0;n<256;n++){
      let c = n;
      for(let k=0;k<8;k++){ c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1); }
      t[n] = c >>> 0;
    }
    return t;
  })();

    let c = 0xFFFFFFFF;
    for(let i=0;i<bytes.length;i++){ c = CRC_TABLE[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8); }
    return (c ^ 0xFFFFFFFF) >>> 0;

  function dosDateTime(d){
    d = d || new Date();
    const time = ((d.getHours() & 0x1F) << 11) | ((d.getMinutes() & 0x3F) << 5) | (Math.floor(d.getSeconds()/2) & 0x1F);
    const date = (((d.getFullYear()-1980) & 0x7F) << 9) | (((d.getMonth()+1) & 0xF) << 5) | (d.getDate() & 0x1F);
    return {time, date};
  }

    function pushU16(arr,n){ arr.push(n & 0xFF, (n>>>8) & 0xFF); }
    function pushU32(arr,n){ arr.push(n & 0xFF, (n>>>8) & 0xFF, (n>>>16) & 0xFF, (n>>>24) & 0xFF); }
    files.forEach(f=>{
      const nameBytes = Array.from(enc.encode(f.name));
      const data = f.data;
      const crc = crc32(data);

      const lh = [];
      pushU32(lh, 0x04034b50); pushU16(lh, 20); pushU16(lh, 0x0800); pushU16(lh, 0);
      pushU16(lh, time); pushU16(lh, date); pushU32(lh, crc); pushU32(lh, size); pushU32(lh, size);
      pushU16(lh, nameBytes.length); pushU16(lh, 0);

  // The Firestore SDK is loaded lazily via dynamic import() — never a static <script> tag — for
  // the same reason jsPDF is: a static tag is processed by the browser before any of our own error
  // handling exists, so a blocked CDN or restrictive sandbox has nowhere to be caught and can
  // surface as a generic, unhelpful "Script error." Dynamic import() is a real JavaScript
  // expression we can wrap in try/catch like anything else, so every failure mode here — network,
  // sandbox, a broken SDK build — resolves to a clear rejected promise instead of a page crash.
  let firestoreReadyPromise = null;
  let db, fsDoc, fsSetDoc, fsGetDoc, fsDeleteDoc, fsCollection, fsGetDocs, fsRunTransaction, fsOnSnapshot;
  // Firestore rejects any write containing a literal `undefined` anywhere in the object, unlike
  // Postgres/Supabase, which silently dropped such fields because the data always passed through
  // JSON.stringify() first. Order objects have many optional fields that can genuinely end up
  // `undefined` (not null) depending on which form fields were left blank, so every direct
  // Firestore write of an order round-trips through JSON first — the exact same sanitization
  // Supabase was doing automatically — rather than hunting down every individual optional field.
  function forFirestore(obj){ return JSON.parse(JSON.stringify(obj)); }

  function initFirestore(){
    if(firestoreReadyPromise) return firestoreReadyPromise;
    firestoreReadyPromise = (async ()=>{
      try{
        const { initializeApp } = await import(`https://www.gstatic.com/firebasejs/${FIREBASE_SDK_VERSION}/firebase-app.js`);
        const fs = await import(`https://www.gstatic.com/firebasejs/${FIREBASE_SDK_VERSION}/firebase-firestore.js`);
        const app = initializeApp(FIREBASE_CONFIG);
        db = fs.getFirestore(app);
        fsDoc = fs.doc; fsSetDoc = fs.setDoc; fsGetDoc = fs.getDoc; fsDeleteDoc = fs.deleteDoc;
        fsCollection = fs.collection; fsGetDocs = fs.getDocs; fsRunTransaction = fs.runTransaction; fsOnSnapshot = fs.onSnapshot;
      }catch(e){
        firestoreReadyPromise = null; // allow a later retry (e.g. after the network recovers)
        throw new Error('Could not connect to the database — check your internet connection and try again.');
      }
    })();
    return firestoreReadyPromise;
  }

  // Generic key/value documents (Purchase Log, CAPA, Users, Notifications) — each lives as one
  // document in the "app_data" collection, keyed by name, matching how these behaved under
  // Firestore (a single JSON blob per data type). Only Orders get the finer per-record treatment
  // below, since that's where the tested multi-user conflict guarantee actually matters.
  async function supaGet(key){
    await initFirestore();
    const snap = await fsGetDoc(fsDoc(db, 'app_data', key));
    if(!snap.exists()) return null;
    return { value: JSON.stringify(snap.data().value) };
  }
  async function supaSet(key, valueStr){
    await initFirestore();
    await fsSetDoc(fsDoc(db, 'app_data', key), { value: JSON.parse(valueStr), updatedAt: new Date().toISOString() });
    return true;
  }

  // ---- Per-order storage ----
  // Each order lives in its own document in the "orders" collection (document ID = the order's
  // own ID) instead of the whole order list being one giant record — different orders can never
  // collide with each other.
  const ORDER_KEY_PREFIX = 'wire-erp:order:'; // kept only as a display-safe prefix for internal bookkeeping shapes shared with the rest of the app; not a real Firestore path
  let orderSyncedAt = {}; // orderId -> last-known _updatedAt this tab has actually seen from the DB

  async function supaGetAllOrders(){
    await initFirestore();
    const snap = await fsGetDocs(fsCollection(db, 'orders'));
    const rows = [];
    snap.forEach(d=>{
      const { _updatedAt, ...orderFields } = d.data();
      rows.push({ key: ORDER_KEY_PREFIX+d.id, value: JSON.stringify(orderFields), updated_at: _updatedAt });
    });
    return rows;
  }

  // Saves ONE order using an ATOMIC conditional update enforced by Firestore itself via a
  // transaction — not a separate "check, then write" done in JavaScript. Inside the transaction,
  // we read the order's current _updatedAt and compare it to what this tab last saw; if they
  // don't match, we throw from inside the transaction callback, which aborts the whole operation
  // with nothing written — Firestore guarantees no other write can slip in between that read and
  // the eventual write within the same transaction. If someone else has saved this order since we
  // last saw it, the mismatch is how we know we lost the race — the database's own guarantee, not
  // a guess made by the browser.
  async function saveOrder(orderId, force){
    await initFirestore();
    const order = state.orders.find(o=>o.id===orderId);
    const ref = fsDoc(db, 'orders', orderId);
    if(!order){
      // The order was deleted locally (e.g. its last item was removed) — remove it from storage too.
      try{ await fsDeleteDoc(ref); }catch(e){ /* already gone, or will be cleaned up next save */ }
      delete orderSyncedAt[orderId];
      return;
    }
    const known = orderSyncedAt[orderId];
    if(force || !known){
      // Brand-new order (nothing to conflict with yet), or an explicit forced overwrite after the
      // user has confirmed they've reviewed the latest version — plain upsert.
      const ts = new Date().toISOString();
      try{ await fsSetDoc(ref, forFirestore({ ...order, _updatedAt: ts })); }
      catch(e){ showToast('Could not save — changes may not persist.'); throw e; }
      orderSyncedAt[orderId] = ts;
      backupOrdersSnapshot();
      return;
    }
    const ts = new Date().toISOString();
    try{
      await fsRunTransaction(db, async (transaction)=>{
        const snap = await transaction.get(ref);
        const currentUpdatedAt = snap.exists() ? snap.data()._updatedAt : null;
        if(currentUpdatedAt !== known){
          throw new Error('This record was updated by another user. Your screen contains older data. Please refresh and review the latest version before saving.');
        }
        transaction.set(ref, forFirestore({ ...order, _updatedAt: ts }));
      });
    }catch(e){
      if(e.message && e.message.indexOf('updated by another user')>=0) throw e;
      showToast('Could not save — changes may not persist.');
      throw e;
    }
    orderSyncedAt[orderId] = ts;
    backupOrdersSnapshot();
  }

  // Rolling daily backup of the FULL reconstructed order list — kept for disaster recovery only;
  // never part of the live per-order save path, so it can't reintroduce the old whole-list risk.
  async function backupOrdersSnapshot(){
    try{
      await initFirestore();

  let notifPollHandle = null;

  // Pulls every order fresh from the database and replaces state.orders + the per-order sync
  // timestamps wholesale. This does NOT re-check any currently-open edit form's input fields (a
  // form the user is actively typing into is left alone — we don't want to yank values out from
  // under someone mid-edit), but it does keep every read-only view (tables, dashboards, item
  // screens not being edited) current, and it means the next save's conflict check is compared
  // against genuinely fresh data rather than whatever this tab happened to load hours ago. Safety
  // itself never depends on this running — saveOrder()'s atomic database check catches a stale
  // save regardless of when this last ran — this is purely about keeping the screen current.
  let refreshingOrders = false;
  async function refreshOrdersFromServer(){
    if(!state.loggedIn || refreshingOrders) return;
    refreshingOrders = true;
    try{
      const rows = await supaGetAllOrders();
      state.orders = rows.map(r=>JSON.parse(r.value));

      rows.forEach(r=>{ orderSyncedAt[r.key.slice(ORDER_KEY_PREFIX.length)] = r.updated_at; });

  // Requirement: returning to a backgrounded tab/app (mobile Safari suspends tabs aggressively)
  // or regaining a lost network connection must never let stale cached data sit unnoticed —
  // both trigger an immediate fresh pull from the database.
  function setupAutoRefreshTriggers(){
    document.addEventListener('visibilitychange', ()=>{

    window.addEventListener('online', refreshOrdersFromServer);

  }

  // Live sync: subscribes to real database changes on the orders collection via Firestore's
  // onSnapshot (a genuine live listener, not polling), so that when another user saves an order,
  // anyone else with the app open sees it update automatically — without waiting for a manual
  // refresh. This is UI convenience only; it never substitutes for the database-level conflict
  // check in saveOrder(), which remains the actual safety guarantee regardless of whether a
  // realtime event arrives in time. onSnapshot automatically re-subscribes after a dropped
  // connection is restored, so this same listener also satisfies "re-sync after reconnect."
  //
  // This reuses the same lazily-loaded Firestore SDK as everything else (initFirestore()), so a
  // failure to connect — blocked network, restrictive sandbox — is caught by the same try/catch
  // that already protects every other database call, rather than a second, separate risk.
  let realtimeDebounceHandle = null;
  function setupRealtimeSync(){
    initFirestore().then(()=>{
      try{
        fsOnSnapshot(fsCollection(db, 'orders'), ()=>{

          realtimeDebounceHandle = setTimeout(refreshOrdersFromServer, 400);
        }, (err)=>{ /* Realtime is optional — polling/visibility refresh still keep data current */ });
      }catch(e){ /* Realtime is optional — its failure must never block the app from working */ }
    }).catch(()=>{ /* Firestore unreachable right now — app still works via polling/visibility refresh */ });
  }

  /* ---- Item Serial Number: global sequential ITEM-001, ITEM-002... ---- */
  function generateItemSerial(poNumber){
    const scope = (poNumber||'').trim().toLowerCase();
    let max = 0;
    state.orders.forEach(o=>{
      const oScope = (o.poNumber||'').trim().toLowerCase();
      if(oScope === scope){
        o.items.forEach(it=>{
          const m = /ITEM-(\d+)/.exec(it.itemSerialNo||'');
          if(m) max = Math.max(max, parseInt(m[1],10));
        });
      }
    });
    (draftOrderItems||[]).forEach(it=>{
      const m = /ITEM-(\d+)/.exec(it.itemSerialNo||'');
      if(m) max = Math.max(max, parseInt(m[1],10));
    });
    return 'ITEM-'+pad3(max+1);
  }

  function mkItem(o){

      // target plus a separate tolerance percentage. Simpler to read and to fill in, and the

      crMax: o.crMax!=null ? Number(o.crMax) : null,
      elongSingleMin: o.elongSingleMin!=null ? Number(o.elongSingleMin) : null,
      copperWtMin: o.copperWtMin!=null ? Number(o.copperWtMin) : null, copperWtMax: o.copperWtMax!=null ? Number(o.copperWtMax) : null,
      dispatchTolerancePct:o.dispatchTolerancePct,
      productGrade:o.productGrade||'Grade A',

      productionStarted:(o.seedInProcess&&o.seedInProcess.length>0)||(o.seedFinalQC&&o.seedFinalQC.length>0)||(o.seedDispatch&&o.seedDispatch.length>0),
      productionPaused:false,
      // Packaging Details — sits below the Production Passes when viewing an item, matching the
      // agreed section order. Reels Deposit Rate auto-fetches from the linked Sales Order's
      // Client-derived reel makes (see fetchReelsDepositRateFromClient()), and Reels Deposit
      // Amount auto-calculates from Reels × Rate — both stay editable afterward regardless.
      packagingType: o.packagingType||'', reelSize: o.reelSize||'', reelsRequiredApprox: o.reelsRequiredApprox!=null ? Number(o.reelsRequiredApprox) : null,
      returnableRate: o.returnableRate!=null ? Number(o.returnableRate) : null,
      returnableAmount: o.returnableAmount!=null ? Number(o.returnableAmount) : null,
      packagingSheetChoice: o.packagingSheetChoice||'', packagingSheetAmount: o.packagingSheetAmount!=null ? Number(o.packagingSheetAmount) : null,
      invoiceGenerated:false,
      rate: o.rate!=null ? Number(o.rate) : null,
      productionPasses: o.productionPasses || [], // wire-drawing pass log — see mkProductionPass()
      inProcessQC:[], finalQC:[], dispatchEntries:[], customerRejections:[], closed:false, activityLog:[],
    };

  // Dynamic Final QC test parameters, by product type — only the parameters relevant to a given
  // product's specification are shown/recorded, per-item.
  function qcParamsForProduct(productType){
    const base = [
      {key:'crValue', label:'CR Value', unit:'Ω'},
      {key:'elongationValue', label:'Elongation', unit:'%'},
    ];
    if(productType==='Bare Copper Wire') return [...base, {key:'diameter', label:'Diameter', unit:'mm'}];
    if(productType==='PV Ribbon') return [...base, {key:'diameter', label:'Diameter', unit:'mm'}];
    return base; // Tinned Copper Wire: CR Value + Elongation (Tin Coating handled as its own dedicated field)
  }
  const QC_PARAM_ORDER = ['crValue','elongationValue','diameter']; // canonical column order when combining multiple products
  const QC_PARAM_LABELS = {crValue:'CR Value', elongationValue:'Elongation', diameter:'Diameter'};
  const QC_PARAM_SHORT_LABELS = {crValue:'CR', elongationValue:'Elong.', diameter:'Dia.'};
  function deriveItemStatus(it){
    return deriveItem(it).status;
  }
  function deriveItem(it){
    const ip = it.inProcessQC||[];
    const inProcessAccepted = ip.filter(q=>q.result==='Pass').reduce((s,q)=>s+q.qty,0);
    const inProcessRejected = ip.reduce((s,q)=>s+(q.rejectQty||0),0);
    const inProcessHold = ip.reduce((s,q)=>s+(q.holdQty||0),0);
    const rejectionCycles = ip.filter(q=>q.result==='Reject').length;

    const fq = it.finalQC||[];
    const finalAccepted = fq.reduce((s,q)=>s+(q.accepted||0),0);
    const finalRejected = fq.reduce((s,q)=>s+(q.rejected||0),0);
    const finalRejectionCycles = fq.filter(q=>(q.rejected||0)>0).length;
    const readyForFinalQC = clamp0(inProcessAccepted - fq.reduce((s,q)=>s+(q.qtyChecked||0),0));

    const dispatched = (it.dispatchEntries||[]).reduce((s,d)=>s+d.qty,0);
    const custRejections = it.customerRejections || [];
    const custReproductionQty = custRejections.filter(c=>c.action==='Reproduction').reduce((s,c)=>s+c.qty,0);
    const custRejectedTotalQty = custRejections.reduce((s,c)=>s+c.qty,0);
    const netDispatched = clamp0(dispatched - custReproductionQty);

    const tolAmt = it.orderQty * (it.dispatchTolerancePct/100);
    const lowerBound = it.orderQty - tolAmt, upperBound = it.orderQty + tolAmt;
    const remainingDispatchableHardCap = clamp0(upperBound - dispatched);
    const availableFinalAcceptedNotDispatched = clamp0(finalAccepted - dispatched);
    const maxDispatchNow = Math.max(0, Math.min(remainingDispatchableHardCap, availableFinalAcceptedNotDispatched));

    const lastIP = ip.length ? ip[ip.length-1] : null;

    let status;
    if(it.closed){ status='Closed'; }
    else if(netDispatched >= lowerBound && netDispatched > 0){ status='Completed'; }
    else if(netDispatched > 0){ status='Partially Dispatched'; }
    else if(availableFinalAcceptedNotDispatched > 0){
      if(!it.invoiceGenerated) status='Pending Accounts';
      else status = (finalAccepted >= lowerBound) ? 'Ready for Dispatch' : 'Partial Ready for Dispatch';
    }
    else if(lastIP && lastIP.result==='Hold' && readyForFinalQC<=0 && finalAccepted<=0){ status='QC Hold'; }
    else if(lastIP && lastIP.result==='Reject' && readyForFinalQC<=0 && finalAccepted<=0){ status='QC Rejected'; }
    else if(it.productionStarted){ status = it.productionPaused ? 'Production Pause' : 'Production Ongoing'; }
    else { status='Pending'; }

    const isDelayed = it.deliveryDate && status!=='Completed' && status!=='Closed' && (new Date(today()) > new Date(it.deliveryDate));
    const repeatedRejection = (rejectionCycles + finalRejectionCycles) > 1;
    const dispatchPct = it.orderQty>0 ? Math.min(100,(netDispatched/it.orderQty)*100) : 0;
    const acceptedPct = it.orderQty>0 ? Math.min(100,(finalAccepted/it.orderQty)*100) : 0;
    const rejectedTotalQty = inProcessRejected + finalRejected;
    const producedQty = ip.reduce((s,q)=>s+q.qty,0);

    return {inProcessAccepted,inProcessRejected,inProcessHold,rejectionCycles,finalAccepted,finalRejected,finalRejectionCycles,
      readyForFinalQC,dispatched,netDispatched,custReproductionQty,custRejectedTotalQty,tolAmt,lowerBound,upperBound,
      remainingDispatchableHardCap,availableFinalAcceptedNotDispatched,maxDispatchNow,status,isDelayed,repeatedRejection,
      dispatchPct,acceptedPct,rejectedTotalQty,producedQty};
  }

  function spoolRing(pctDispatched,pctAccepted,size){
    size=size||54; const r=size/2-6, c=size/2, circ=2*Math.PI*r;

      <circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="#B9E1E6" stroke-width="6" stroke-dasharray="${dashAccept} ${circ}" transform="rotate(-90 ${c} ${c})"/>
      <circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="#077B8E" stroke-width="6" stroke-dasharray="${dashDispatch} ${circ}" stroke-linecap="round" transform="rotate(-90 ${c} ${c})"/>
      <circle cx="${c}" cy="${c}" r="${r-11}" fill="none" stroke="#3A3A3C" stroke-width="2"/>

    navStack = []; mainListSnapshot = null;
    render();
  }
  function closeAllOverlays(){
    state.drawerOrder=null; state.drawerItem=null; state.drawerPR=null; state.modal=null; state.drillDown=null;
  }
  // Call BEFORE opening a drawerItem/drawerOrder to remember where "Back" should return to,
  // based on whatever overlay context is currently on screen.
  // Snapshot the current screen onto the history stack BEFORE navigating deeper into a new one.
  function pushNavState(){
    navStack.push({
      tab: state.tab,
      drillDown: state.drillDown,
      drawerOrder: state.drawerOrder,
      drawerItem: state.drawerItem,
      columnFilters: {...state.columnFilters},
    });
  }
  function currentScreenLabel(){
    if(state.drawerOrder) return 'Order';
    if(state.drillDown) return DRILL_TITLES[state.drillDown]||'List';
    return {dashboard:'Dashboard', workorders:'Work Orders', purchase:'Purchase Log', capa:'CAPA', users:'User Management'}[state.tab] || 'Work Orders';
  }
  function backButtonLabel(){
    if(navStack.length===0) return 'Back';
    const prev = navStack[navStack.length-1];
    if(prev.drawerOrder) return 'Back to Order';
    if(prev.drillDown) return 'Back to '+(DRILL_TITLES[prev.drillDown]||'List');
    return 'Back to '+({dashboard:'Dashboard', workorders:'Work Orders', purchase:'Purchase Log', capa:'CAPA', users:'User Management'}[prev.tab] || 'Work Orders');
  }
  function goBack(){
    if(navStack.length>0){
      const prev = navStack.pop();
      state.tab = prev.tab;
      state.drillDown = prev.drillDown;
      state.drawerOrder = prev.drawerOrder;
      state.drawerItem = prev.drawerItem;
      state.columnFilters = prev.columnFilters;
    } else {
      state.drillDown=null; state.drawerOrder=null; state.drawerItem=null;
    }
    state.drawerPR=null;
    state.modal=null;
  }
  // Call BEFORE opening a drawerItem/drawerOrder. Records the list screen the user is leaving
  // ONLY on the first hop into a fresh Item Log / View Full Order chain — further navigation
  // within that chain (item -> order, order -> item) leaves it untouched, so Close always lands
  // back on the original list no matter how many levels deep the user went.
  function enterDrawerChain(){
    if(!state.drawerItem && !state.drawerOrder){
      mainListSnapshot = { tab: state.tab, drillDown: state.drillDown, columnFilters: {...state.columnFilters} };
    }
  }
  // Close: always returns to the original Main List the current chain started from, regardless
  // of how many drawers deep the user navigated. Independent of goBack()/Back button.
  function closeToMainList(){
    if(mainListSnapshot){
      state.tab = mainListSnapshot.tab;
      state.drillDown = mainListSnapshot.drillDown;
      state.columnFilters = mainListSnapshot.columnFilters;
    } else {
      state.drillDown = null;
    }
    state.drawerOrder=null; state.drawerItem=null; state.drawerPR=null; state.modal=null;
    mainListSnapshot = null;
    navStack = [];
  }

  /* ================= HELPER: flatten items across orders ================= */
  function allItemsFlat(){
    const rows = [];
    state.orders.forEach(o=> o.items.forEach(it=> rows.push({order:o, item:it, d:deriveItem(it)})));
    return rows;
  }
  // Distinct customer names across all orders, alphabetically sorted — feeds the customer
  // datalist so past customers can be picked instead of retyped, while still allowing free text
  // for a brand-new customer (a datalist doesn't restrict the input to only listed values).
  function distinctCustomers(){
    const names = new Set();
    state.orders.forEach(o=>{ if(o.customer) names.add(o.customer); });
    return [...names].sort((a,b)=> a.localeCompare(b));
  }

  // Compact table display helpers — short product codes, "wires/size" spec format, and a
  // shortened item serial for dense list views. These are DISPLAY-ONLY: the underlying stored
  // productType and itemSerialNo (e.g. "ITEM-001") are untouched, so existing data, exports, and
  // every calculation elsewhere in the app keep working exactly as before.
  const PRODUCT_SHORT_CODE = {'Tinned Copper Wire':'ATC', 'Bare Copper Wire':'ABC', 'PV Ribbon':'PVB'};
  function productShortCode(productType){ return PRODUCT_SHORT_CODE[productType] || productType; }
  function wireSpecShort(it){ return `${it.numWires}/${it.wireSize}`; }
  function shortItemSerial(itemSerialNo){ return (itemSerialNo||'').replace(/^ITEM-/, 'I-'); }
  function processShort(processType){ return processType==='Bunched' ? 'B' : processType==='Parallel' ? 'P' : (processType||''); }
  function gradeShort(productGrade){ return (productGrade||'').replace(/^Grade\s*/i, '') || '—'; }

  // Current Orders priority sort: Delayed (most overdue first) -> active items by ascending
  // delivery date (earliest due first) -> Completed/Closed always last, regardless of date.
  function currentOrdersPriorityRank(d){
    if(d.status==='Completed' || d.status==='Closed') return 2;
    if(d.isDelayed) return 0;
    return 1;
  }
  function currentOrdersSort(rows){
    return rows.slice().sort((a,b)=>{
      const rankA = currentOrdersPriorityRank(a.d), rankB = currentOrdersPriorityRank(b.d);
      if(rankA !== rankB) return rankA - rankB;
      const dateA = a.item.deliveryDate ? new Date(a.item.deliveryDate).getTime() : Infinity;
      const dateB = b.item.deliveryDate ? new Date(b.item.deliveryDate).getTime() : Infinity;
      return dateA - dateB;
    });
  }

  /* ================= COLUMN-LEVEL TABLE FILTERS (built into each table's header row) ================= */
  function columnFiltersActive(keys){
    return keys.some(k=> !!state.columnFilters[k]);
  }
  function clearColumnFilters(keys){
    keys.forEach(k=> state.columnFilters[k] = '');
  }
  function reRenderPreservingFocus(){
    const active = document.activeElement;
    const id = active && active.id;
    const selStart = (active && typeof active.selectionStart === 'number') ? active.selectionStart : null;
    const selEnd = (active && typeof active.selectionEnd === 'number') ? active.selectionEnd : null;
    render();
    if(id){
      const el = document.getElementById(id);
      if(el){
        el.focus();
        if(selStart!=null && el.setSelectionRange){ try{ el.setSelectionRange(selStart, selEnd); }catch(e){} }
      }
    }
  }
  function colFilterInput(key, placeholder){
    return `<input id="colf-${key}" data-colfilter="${key}" type="text" value="${esc(state.columnFilters[key]||'')}" placeholder="${esc(placeholder)}" style="width:100%; box-sizing:border-box; font-size:11.5px; font-weight:400; padding:4px 6px; border:1px solid var(--line); border-radius:5px; background:#fff;">`;
  }
  function colFilterSelect(key, options){
    return `<select id="colf-${key}" data-colfilter="${key}" style="width:100%; box-sizing:border-box; font-size:11.5px; font-weight:400; padding:4px 4px; border:1px solid var(--line); border-radius:5px; background:#fff;">
      <option value="">All</option>
      ${options.map(o=>`<option value="${esc(o.value)}" ${state.columnFilters[key]===o.value?'selected':''}>${esc(o.label)}</option>`).join('')}
    </select>`;
  }
  function columnFilteredItems(rows){
    const f = state.columnFilters;
    let out = rows;
    if(f.po) out = out.filter(r=> (r.order.poNumber||'').toLowerCase().includes(f.po.trim().toLowerCase()));
    if(f.customer) out = out.filter(r=> r.order.customer.toLowerCase().includes(f.customer.trim().toLowerCase()));
    if(f.item) out = out.filter(r=> r.item.itemSerialNo.toLowerCase().includes(f.item.trim().toLowerCase()));
    if(f.status) out = out.filter(r=> r.d.status === f.status);
    return out;
  }
  function columnFilteredPurchase(rows){
    const f = state.columnFilters;
    let out = rows;
    if(f.prNo) out = out.filter(p=> (p.prNo||'').toLowerCase().includes(f.prNo.trim().toLowerCase()));
    if(f.prItem) out = out.filter(p=> { const q=f.prItem.trim().toLowerCase(); return (p.itemName||'').toLowerCase().includes(q) || (p.itemCode||'').toLowerCase().includes(q); });
    if(f.prStage) out = out.filter(p=> p.status === f.prStage);
    if(f.prBy) out = out.filter(p=> (p.createdBy||'').toLowerCase().includes(f.prBy.trim().toLowerCase()));
    return out;
  }

  /* ================= DASHBOARD (item-wise, 9 clickable panels) ================= */
  // An item is "QC Pending" if it has material waiting on either QC stage — regardless of its
  // overall order status — and automatically stops being pending the moment that QC is recorded,
  // since this is derived live from current item state on every render.
  function qcPendingInfo(wo, d){
    const inProcess = !!wo.productionStarted && (d.status==='Production Ongoing' || d.status==='Production Pause' || d.status==='QC Hold' || d.status==='QC Rejected');
    const final = d.readyForFinalQC > 0;
    return { inProcess, final, pending: inProcess || final };
  }

  function dashboardHTML(){
    const rows = allItemsFlat();
    const purchaseRows = state.purchase;
    let panels = [
      {key:'current', n:rows.length, l:'Current Items'},
      {key:'pending', n:rows.filter(r=>r.d.status==='Pending').length, l:'Pending'},
      {key:'qcpending', n:rows.filter(r=>qcPendingInfo(r.item, r.d).pending).length, l:'QC Pending', cls:'warn'},
      {key:'ongoing', n:rows.filter(r=>r.d.status==='Production Ongoing').length, l:'Production Ongoing'},
      {key:'partial', n:rows.filter(r=>r.d.status==='Partially Dispatched'||r.d.status==='Ready for Dispatch').length, l:'In Dispatch (Partial)'},
      {key:'completed', n:rows.filter(r=>r.d.status==='Completed').length, l:'Completed', cls:'ok'},
      {key:'qcrej', n:rows.reduce((s,r)=>s+r.item.inProcessQC.filter(q=>q.result==='Reject').length+r.item.finalQC.filter(q=>(q.rejected||0)>0).length,0), l:'QC Rejections (All-Time)', cls:'warn'},
      {key:'repeat', n:rows.filter(r=>r.d.repeatedRejection).length, l:'Repeated QC Rejections', cls:'flag'},
      {key:'prpending', n:purchaseRows.filter(p=>p.status!=='Approved' && p.status!=='Rejected').length, l:'Pending Purchase Requisitions', cls:'warn'},
      {key:'attention', n:rows.filter(r=>r.d.repeatedRejection||r.d.isDelayed||r.d.status==='QC Hold'||r.d.status==='QC Rejected').length, l:'Attention Needed', cls:'flag'},
    ];
    return `
    <div class="kpi-grid">
      ${panels.map(p=>`<div class="kpi ${p.cls||''}" data-drill="${p.key}"><div class="n mono">${p.n}</div><div class="l">${p.l}</div></div>`).join('')}
    </div>
    <div class="note-box">Click any panel to open its list — each table lets you search/filter directly by column. Each row is one item; an order with multiple items shows one row per item.</div>`;
  }

  function drillFilter(key, rows){
    switch(key){
      case 'current': return rows;
      case 'pending': return rows.filter(r=>r.d.status==='Pending');
      case 'qcpending': return rows.filter(r=>qcPendingInfo(r.item, r.d).pending);
      case 'ongoing': return rows.filter(r=>r.d.status==='Production Ongoing');
      case 'partial': return rows.filter(r=>r.d.status==='Partially Dispatched'||r.d.status==='Ready for Dispatch');
      case 'completed': return rows.filter(r=>r.d.status==='Completed');
      case 'repeat': return rows.filter(r=>r.d.repeatedRejection);
      case 'attention': return rows.filter(r=>r.d.repeatedRejection||r.d.isDelayed||r.d.status==='QC Hold'||r.d.status==='QC Rejected');
      case 'qcrej': return rows.filter(r=>r.item.inProcessQC.some(q=>q.result==='Reject')||r.item.finalQC.some(q=>(q.rejected||0)>0));
      default: return rows;
    }
  }
  const DRILL_TITLES = {current:'Current Items',pending:'Pending',qcpending:'QC Pending',ongoing:'Production Ongoing',partial:'In Dispatch (Partial)',completed:'Completed Items',qcrej:'Items With QC Rejections',repeat:'Repeated QC Rejections',attention:'Attention Needed',prpending:'Pending Purchase Requisitions'};
  const STATUS_OPTIONS = ['Pending','Production Ongoing','Production Pause','QC Hold','QC Rejected','Pending Accounts','Ready for Dispatch','Partial Ready for Dispatch','Partially Dispatched','Completed','Closed'].map(s=>({value:s, label:(STATUS_META[s]?STATUS_META[s].label:s)}));
  const PR_STAGE_OPTIONS = ['Pending Purchase Action','Pending MD Approval','Returned for Correction','Approved','Rejected'].map(s=>({value:s, label:s}));

  function drillWrap(title, bodyHTML, filterKeys){
    const anyActive = filterKeys && columnFiltersActive(filterKeys);
    return `<div class="modal-backdrop">
      <div class="modal" data-stop="1" style="max-width:960px;">
        <div class="modal-head">
          <div>
            <button class="btn btn-ghost btn-sm" data-close-drill="1" style="margin-bottom:6px; padding:3px 8px;">← ${esc(backButtonLabel())}</button>
            <h2>${title}</h2>
          </div>
          <div style="display:flex; align-items:center; gap:8px;">
            ${anyActive ? `<button class="btn btn-ghost btn-sm" data-clear-col-filters="${(filterKeys||[]).join(',')}">Clear filters</button>` : ''}
            <button class="x-btn" data-close-drill="1">✕</button>
          </div>
        </div>
        <div class="modal-body">${bodyHTML}</div>
        <div class="modal-foot"><button class="btn" data-close-drill="1">Close</button></div>
      </div>
    </div>`;
  }
  function drillDownModal(){
    const key = state.drillDown;
    if(key==='prpending'){
      const prKeys = ['prNo','prItem','prStage','prBy'];
      const rowsPR = columnFilteredPurchase(state.purchase.filter(p=>p.status!=='Approved' && p.status!=='Rejected'));
      return drillWrap(DRILL_TITLES[key], `

          </tbody>
        </table></div>

    }
    const itemKeys = ['po','customer','item','status'];

    const showQcPendingCol = key==='qcpending';
    return drillWrap(DRILL_TITLES[key], `
      <div class="table-scroll"><table style="min-width:${showQcPendingCol?840:720}px;">
        <thead>
          <tr><th>SR</th><th>PO No.</th><th>Customer</th><th>Item</th><th>Spec</th><th>Order<br>Qty</th><th>Prog.</th><th>Status</th><th>Flags</th>${showQcPendingCol?'<th>QC<br>Pending</th>':''}<th>Actions</th></tr>
          <tr>

            <th></th>
            <th></th>
            <th></th>
            <th>${colFilterSelect('status', STATUS_OPTIONS)}</th>
            <th></th>
            ${showQcPendingCol?'<th></th>':''}
            <th></th>
          </tr>
        </thead>
        <tbody>
          ${rows.length===0?`<tr><td colspan="${showQcPendingCol?11:10}"><div class="log-empty">No matching items.</div></td></tr>`:
            rows.map((r,idx)=>`
            <tr class="clickable" data-open-item-fromdrill="${r.order.id}|${r.item.id}">
              <td class="mono">${idx+1}</td><td class="mono">${r.order.poNumber||'—'}</td><td>${esc(r.order.customer)}</td>
              <td class="mono" style="color:var(--brand);">${esc(shortItemSerial(r.item.itemSerialNo))}</td>
              <td style="font-size:10px; color:var(--ink-soft); line-height:1.3;">${productShortCode(r.item.productType)} · ${processShort(r.item.processType)}<br>${wireSpecShort(r.item)} · <span class="mono">${gradeShort(r.item.productGrade)}</span></td>
              <td class="mono">${round1(r.item.orderQty)}</td>
              <td class="mono">${round1(r.d.dispatchPct)}%</td>
              <td>${statusPill(r.d.status)}</td>
              <td>${r.d.repeatedRejection?'<span class="flag-repeat">⛔</span>':''} ${r.d.isDelayed?'<span class="flag-delay">⏱</span>':''}</td>
              ${showQcPendingCol ? `<td>${(function(){
                const info = qcPendingInfo(r.item, r.d);
                const labels = [];
                if(info.inProcess) labels.push(`<span class="pill pill-status partial" title="In-Process QC Pending"><span class="pill-dot"></span>IQP</span>`);
                if(info.final) labels.push(`<span class="pill pill-status partial" title="Final QC Pending"><span class="pill-dot"></span>FQP</span>`);
                return labels.join(' ') || '—';
              })()}</td>` : ''}
              <td>

  /* ================= EXCEL EXPORT — CURRENT ORDERS (raw OOXML, no external library) ================= */
  function itemSpecString(it){
    const base = `${it.wireSize} \u00b7 ${it.numWires} Wires \u00b7 ${it.processType}`;
    const crPart = (it.crMax!=null) ? ` \u00b7 CR \u2264${it.crMax}\u03a9` : '';
    if(it.processType==='Bunched'){
      return base + (it.bunchLay ? ` \u00b7 Bunch Lay ${it.bunchLay} Twist` : '') + (it.twistDir ? ` \u00b7 ${it.twistDir}` : '') + crPart;
    }
    return base + crPart;
  }
  function xlsxColLetter(n){ let s=''; while(n>0){ const m=(n-1)%26; s=String.fromCharCode(65+m)+s; n=Math.floor((n-1)/26); } return s; }
  function excelSerialDate(date){ const epoch = Date.UTC(1899,11,30); return Math.round((date.getTime()-epoch)/86400000); }

  function buildXlsxSheetXml(headers, rows, colTypes){
    const nCols = headers.length, nRows = rows.length;
    const lastColLetter = xlsxColLetter(nCols);
    let cols = '<cols>';
    headers.forEach((h,i)=>{ cols += `<col min="${i+1}" max="${i+1}" width="${Math.max(h.length+3,12)}" customWidth="1"/>`; });
    cols += '</cols>';

    let sheetData = '<sheetData>';
    // header row
    sheetData += `<row r="1">`;
    headers.forEach((h,i)=>{
      const ref = xlsxColLetter(i+1)+'1';
      sheetData += `<c r="${ref}" t="inlineStr" s="1"><is><t xml:space="preserve">${xmlEscape(h)}</t></is></c>`;
    });
    sheetData += `</row>`;
    // data rows
    rows.forEach((row,ri)=>{
      const r = ri+2;
      sheetData += `<row r="${r}">`;
      row.forEach((val,ci)=>{
        const ref = xlsxColLetter(ci+1)+r;
        const type = colTypes[ci];
        if(type==='date'){
          if(val instanceof Date){ sheetData += `<c r="${ref}" s="2"><v>${excelSerialDate(val)}</v></c>`; }
          else{ sheetData += `<c r="${ref}" t="inlineStr"><is><t></t></is></c>`; }
        } else if(type==='num'){
          const n = (val==null || val==='') ? '' : Number(val);
          sheetData += (n===''||isNaN(n)) ? `<c r="${ref}"/>` : `<c r="${ref}"><v>${n}</v></c>`;
        } else {
          sheetData += `<c r="${ref}" t="inlineStr"><is><t xml:space="preserve">${xmlEscape(val==null?'':String(val))}</t></is></c>`;
        }
      });
      sheetData += `</row>`;
    });
    sheetData += '</sheetData>';

    const dimension = `A1:${lastColLetter}${nRows+1}`;
    const autoFilter = `<autoFilter ref="${dimension}"/>`;
    const sheetViews = `<sheetViews><sheetView workbookViewId="0"><pane xSplit="0" ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/><selection pane="bottomLeft" activeCell="A2" sqref="A2"/></sheetView></sheetViews>`;

    return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><dimension ref="${dimension}"/>${sheetViews}${cols}${sheetData}${autoFilter}</worksheet>`;
  }

  function buildXlsxStylesXml(){
    return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">
      <numFmts count="1"><numFmt numFmtId="164" formatCode="dd\\-mmm\\-yyyy"/></numFmts>
      <fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><color rgb="FFFFFFFF"/><name val="Calibri"/></font></fonts>
      <fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FF33566F"/><bgColor indexed="64"/></patternFill></fill></fills>
      <borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders>
      <cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>
      <cellXfs count="3">
        <xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/>
        <xf numFmtId="0" fontId="1" fillId="2" borderId="0" xfId="0" applyFont="1" applyFill="1"/>
        <xf numFmtId="164" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/>
      </cellXfs>
    </styleSheet>`;
  }

  function exportCurrentOrdersExcel(){
    const rows = allItemsFlat();
    if(rows.length===0){ showToast('No current orders to export.'); return; }

    const headers = ['Order No.','PO No.','PO Date','Customer','Product','Grade','Process Type','Specification','No. of Wires','Order Qty','Produced Qty','Dispatched Qty','Rejected Qty','Balance Qty','Progress %','CR Max (\u03a9)','Elongation Min \u2014 Single Wire (%)','Order Status','Order Date','Target Date','Remarks'];
    const colTypes = ['str','str','date','str','str','str','str','str','num','num','num','num','num','num','num','num','num','str','date','date','str'];

    const dataRows = rows.map(r=>{
      const o=r.order, it=r.item, d=r.d;
      const balance = clamp0(it.orderQty - d.netDispatched);
      return [
        o.id,
        o.poNumber || '',
        o.poDate ? new Date(o.poDate) : null,
        o.customer,
        it.productType,
        it.productGrade || '',
        it.processType,
        itemSpecString(it),
        it.numWires,
        it.orderQty,
        round1(d.producedQty),
        round1(d.dispatched),
        round1(d.rejectedTotalQty),
        round1(balance),
        Math.round(d.dispatchPct),
        it.crMax!=null ? it.crMax : '',
        it.elongSingleMin!=null ? it.elongSingleMin : '',
        d.status,
        o.createdAt ? new Date(o.createdAt) : null,
        it.deliveryDate ? new Date(it.deliveryDate) : null,
        o.remarks || '',
      ];
    });

    const sheetXml = buildXlsxSheetXml(headers, dataRows, colTypes);
    const stylesXml = buildXlsxStylesXml();
    const workbookXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="Current Orders" sheetId="1" r:id="rId1"/></sheets></workbook>`;
    const workbookRelsXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`;
    const contentTypesXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>`;
    const rootRelsXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`;

    const zipFiles = [
      zipTextPart('[Content_Types].xml', contentTypesXml),
      zipTextPart('_rels/.rels', rootRelsXml),
      zipTextPart('xl/workbook.xml', workbookXml),
      zipTextPart('xl/_rels/workbook.xml.rels', workbookRelsXml),
      zipTextPart('xl/styles.xml', stylesXml),
      zipTextPart('xl/worksheets/sheet1.xml', sheetXml),
    ];
    const zipBytes = buildZip(zipFiles);
    const blob = new Blob([zipBytes], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = 'Current_Orders.xlsx';
    document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
    showToast(`Exported ${dataRows.length} item(s) to Current_Orders.xlsx.`);
  }

  // The Production Passes sub-table — edited entirely inline, directly in the item view, never
  // via a separate modal. At most one row is ever in edit mode at a time (tracked by

  function productionPassesTableHtml(o, wo){

      return `<tr class="pass-edit-row">

        <td><select id="passType" ${cellIn}><option value="ATC" ${v.type==='ATC'?'selected':''}>ATC</option><option value="ABC" ${v.type==='ABC'?'selected':''}>ABC</option></select></td>

    function readOnlyRow(p, idx){
      return `<tr>

        <td class="mono">${esc(p.type)||'—'}</td>

        <td class="mono">${p.qtyKM!=null?p.qtyKM:'—'}</td>
        <td class="mono">${p.noOfReels!=null?p.noOfReels:'—'}</td>
        <td style="font-size:10px;">${esc(p.remarks)||'—'}</td>
        <td style="font-size:10px; color:var(--ink-soft);">${esc(p.createdBy||'—')}<br>${fmtDT(p.createdAt)}</td>

    const rows = passes.map((p,idx)=> (editingId===p.id) ? editableRow(p) : readOnlyRow(p, idx)).join('');
    const newRow = (editingId==='new') ? editableRow(null) : '';
    const showAddButton = !wo.closed && can('editDeleteOrder') && !editingHere;

    if(passes.length===0 && !editingHere){
      return `<div class="log-empty">No passes recorded yet.</div>${showAddButton?`<div style="margin-top:8px;"><button class="btn btn-steel btn-sm" data-add-pass-row="${itemKey}">+ Add Pass</button></div>`:''}`;

    return `<div class="table-scroll"><table style="min-width:900px;"><thead><tr><th>Pass</th><th>Input<br>Size</th><th>Type</th><th>M/C<br>No.</th><th>Die Size</th><th>Tol.</th><th>Qty<br>(KM)</th><th>Reels</th><th>Remarks</th><th>By/Time</th><th>Actions</th></tr></thead>
      <tbody>${rows}${newRow}</tbody></table></div>
      ${showAddButton?`<div style="margin-top:8px;"><button class="btn btn-steel btn-sm" data-add-pass-row="${itemKey}">+ Add Pass</button></div>`:''}`;
  }

  // Same look and row shape as productionPassesTableHtml, but for an item that has no real id

  // via direct DOM update (never a full app render()), so nothing else typed into the Add Item
  // form is ever disturbed while passes are being added.
  function draftPassesEditorHtml(){
    function editableRow(p, idx){
      const v = p || {inputSize:'',type:'ABC',mcNo:'',dieSize:'',sizeTolerance:'',qtyKM:null,noOfReels:null,remarks:''};
      const cellIn = 'style="width:100%; font-size:10px; padding:3px 4px;"';
      return `<tr class="pass-edit-row">
        <td class="mono">${idx+1}</td>
        <td><input id="draftPassInputSize" value="${esc(v.inputSize)}" placeholder="15/0.235" ${cellIn}></td>
        <td><select id="draftPassType" ${cellIn}><option value="ATC" ${v.type==='ATC'?'selected':''}>ATC</option><option value="ABC" ${v.type==='ABC'?'selected':''}>ABC</option></select></td>
        <td><input id="draftPassMcNo" value="${esc(v.mcNo)}" placeholder="16 Line" ${cellIn}></td>
        <td><input id="draftPassDieSize" value="${esc(v.dieSize)}" placeholder="10/0.238 + 5/0.242" ${cellIn}></td>
        <td><input id="draftPassSizeTolerance" value="${esc(v.sizeTolerance)}" placeholder="±0.001" ${cellIn}></td>
        <td><input id="draftPassQtyKM" type="number" min="0" step="0.01" value="${v.qtyKM!=null?v.qtyKM:''}" ${cellIn}></td>
        <td><input id="draftPassNoOfReels" type="number" min="0" step="1" value="${v.noOfReels!=null?v.noOfReels:''}" ${cellIn}></td>
        <td><input id="draftPassRemarks" value="${esc(v.remarks)}" ${cellIn}></td>
        <td><div style="display:flex; gap:3px;"><button type="button" class="btn btn-primary btn-sm" data-save-draft-pass-row="1">Save</button><button type="button" class="btn btn-ghost btn-sm" data-cancel-draft-pass-row="1">Cancel</button></div></td>
      </tr>`;
    }
    function readOnlyRow(p, idx){
      return `<tr>
        <td class="mono">${idx+1}</td>
        <td class="mono">${esc(p.inputSize)||'—'}</td>
        <td class="mono">${esc(p.type)||'—'}</td>
        <td>${esc(p.mcNo)||'—'}</td>
        <td style="font-size:9.5px;">${esc(p.dieSize)||'—'}</td>
        <td class="mono" style="font-size:9.5px;">${esc(p.sizeTolerance)||'—'}</td>
        <td class="mono">${p.qtyKM!=null?p.qtyKM:'—'}</td>
        <td class="mono">${p.noOfReels!=null?p.noOfReels:'—'}</td>
        <td style="font-size:10px;">${esc(p.remarks)||'—'}</td>
        <td><div style="display:flex; gap:3px;"><button type="button" class="btn btn-ghost btn-sm" data-edit-draft-pass-row="${idx}">Edit</button><button type="button" class="btn btn-ghost btn-sm" data-remove-draft-pass-row="${idx}" style="color:var(--red);">Remove</button></div></td>
      </tr>`;
    }
    const rows = draftItemPasses.map((p,idx)=> (editingDraftPassIdx===idx) ? editableRow(p, idx) : readOnlyRow(p, idx)).join('');
    const newRow = (editingDraftPassIdx==='new') ? editableRow(null, draftItemPasses.length) : '';
    const showAddButton = editingDraftPassIdx==null;
    const table = (draftItemPasses.length===0 && editingDraftPassIdx==null)
      ? `<div class="log-empty">No passes added yet.</div>`
      : `<div class="table-scroll"><table style="min-width:820px;"><thead><tr><th>Pass</th><th>Input<br>Size</th><th>Type</th><th>M/C<br>No.</th><th>Die Size</th><th>Tol.</th><th>Qty<br>(KM)</th><th>Reels</th><th>Remarks</th><th>Actions</th></tr></thead>
        <tbody>${rows}${newRow}</tbody></table></div>`;
    return `${table}${showAddButton?`<div style="margin-top:8px;"><button type="button" class="btn btn-steel btn-sm" data-add-draft-pass-row="1">+ Add Pass</button></div>`:''}`;
  }
  function drawerItem(){

    if(!o || !wo) return '';
    const d = deriveItem(wo);
    const elongRange = applicableElongRange(wo);
    const dispatchedPct=d.dispatchPct, acceptedPct=d.acceptedPct, rejectedPctOfOrder = wo.orderQty>0?(d.rejectedTotalQty/wo.orderQty)*100:0;
    return `

      </div>
      <div class="drawer-body">

          <div class="spec-item"><div class="k">Process Type</div><div class="v">${esc(wo.processType)}</div></div>
          <div class="spec-item"><div class="k">No. of Wires / Size</div><div class="v">${esc(wo.numWires)}/${esc(wo.wireSize)}</div></div>

          <div class="spec-item"><div class="k">Twist Dir.</div><div class="v">${wo.twistDir==='LH'?'Left-Hand':(wo.twistDir==='RH'?'Right-Hand':'—')}</div></div>` : ''}

          <div class="spec-item"><div class="k">Dispatch Tol. (%)</div><div class="v">±${wo.dispatchTolerancePct}% (${round1(d.lowerBound)}–${round1(d.upperBound)} kg)</div></div>
          <div class="spec-item"><div class="k">CR (Max)</div><div class="v">${maxOnlyLabel(wo.crMax,' Ω')}</div></div>
          <div class="spec-item"><div class="k">Elongation (Min, Single Wire)</div><div class="v">${minOnlyLabel(wo.elongSingleMin,'%')}</div></div>

        </div>

        <div class="log-block">
          <h3>Quantity Balance</h3>
          <div class="qty-bar-track">
            <div class="qty-bar-seg" style="width:${dispatchedPct}%; background:#077B8E;"></div>
            <div class="qty-bar-seg" style="width:${Math.max(0,acceptedPct-dispatchedPct)}%; background:#B9E1E6;"></div>
            <div class="qty-bar-seg" style="width:${Math.min(100-acceptedPct, rejectedPctOfOrder)}%; background:#A63B32;"></div>
          </div>
          <div class="qty-legend">
            <span><i class="dot" style="background:#077B8E;"></i>Dispatched ${round1(d.dispatched)} kg</span>
            <span><i class="dot" style="background:#B9E1E6;"></i>Final-QC accepted, awaiting dispatch ${round1(clamp0(d.finalAccepted-d.dispatched))} kg</span>

          <div style="margin-top:10px; font-size:12px; color:var(--ink-soft);">Order Qty ${wo.orderQty.toLocaleString('en-IN')} kg = Final-QC Accepted &amp; Dispatched. Max dispatchable now: <b class="mono">${round3(d.maxDispatchNow)} kg</b>.</div>
        </div>

        <div class="log-block"><h3>Production</h3>
          ${wo.closed ? `<div class="log-empty">Item closed.</div>` : (!wo.productionStarted ? (can('startProd') ? `<button class="btn btn-steel btn-sm" data-start-prod="${o.id}|${wo.id}">Start Production</button>` : `<div class="log-empty">Not started.</div>`)
            : `<div style="display:flex; align-items:center; gap:10px; flex-wrap:wrap;">
                <div class="log-empty" style="margin:0;">Production ${wo.productionPaused?'paused':'ongoing'}. Status updates automatically from QC and dispatch entries below.</div>
                ${can('startProd') ? (wo.productionPaused
                  ? `<button class="btn btn-steel btn-sm" data-resume-prod="${o.id}|${wo.id}">Resume Production</button>`

          <div class="spec-grid">
            <div class="spec-item"><div class="k">Packaging Type</div><div class="v">${esc(wo.packagingType)||'Not set'}${wo.reelSize?' '+esc(wo.reelSize):''}</div></div>
            <div class="spec-item"><div class="k">No. of Reels</div><div class="v">${wo.reelsRequiredApprox!=null?wo.reelsRequiredApprox:'—'}</div></div>
            <div class="spec-item"><div class="k">Reels Deposit Rate</div><div class="v">${wo.returnableRate!=null?'₹'+wo.returnableRate:'—'}</div></div>

          <tbody>${wo.inProcessQC.slice().reverse().map(q=>`
            <tr><td class="mono">${q.qty} kg</td><td class="mono">${q.cr??'—'}</td><td class="mono">${q.elong??'—'}${q.elong!=null?'%':''}</td>
              <td class="mono">${q.copperWt!=null?q.copperWt:'—'}</td>
              ${wo.productType==='Tinned Copper Wire'?`<td>${q.perSulphateTest ? `<span class="pill ${q.perSulphateTest==='Pass'?'complete':'rejected'}"><span class="pill-dot"></span>${esc(q.perSulphateTest)}</span>` : '—'}</td>`:''}
              <td class="mono">${q.spool||'—'}</td>
              <td>${q.result==='Pass'?`<span class="pill complete"><span class="pill-dot"></span>Pass</span>`:q.result==='Hold'?`<span class="pill partial"><span class="pill-dot"></span>Hold</span>`:`<span class="pill rejected"><span class="pill-dot"></span>Reject</span>`}</td>
              <td class="mono" style="text-align:center;">${q.holdQty?round1(q.holdQty):'—'}</td>
              <td class="mono" style="text-align:center;">${q.rejectQty?round1(q.rejectQty):'—'}</td>
              <td style="font-size:12px;">${esc(q.remarks||'—')}</td>
              <td class="mono" style="color:var(--brand); font-size:11.5px;">${esc(wo.itemSerialNo)}</td>
              <td style="font-size:11px; color:var(--ink-soft);">${esc(q.by||'—')}<br>${fmtDT(q.timestamp)}</td>
              ${can('editDeleteOrder')?`<td><button class="btn btn-ghost btn-sm" data-delete-ipqc="${o.id}|${wo.id}|${q.id}" style="color:var(--red);">Delete</button></td>`:''}
            </tr>`).join('')}</tbody></table></div>`}
          <div style="margin-top:8px; font-size:11.5px; color:var(--ink-soft);">Reference elongation range: <b>${rangeLabel(elongRange.min,elongRange.max,'%')}</b> (${wo.processType==='Bunched'?'Bunched Wire':'Single Wire'} spec) — values outside this band block Pass; Hold/Reject remain a manual inspector choice.</div>
          ${!wo.closed && wo.productionStarted && can('addQC') ? `<div style="margin-top:10px;"><button class="btn btn-steel btn-sm" data-open-modal="addInProcessQC" data-item="${o.id}|${wo.id}">+ Record In-Process QC</button></div>` : ''}
        </div>

        <div class="log-block"><h3>Final Product QC</h3>
          ${wo.finalQC.length===0 ? `<div class="log-empty">No final QC entries yet.</div>` : `
          <div class="table-scroll"><table><thead><tr><th>Checked</th><th>Accepted</th><th>Rejected</th><th>Result</th>${qcParamsForProduct(wo.productType).map(p=>`<th>${esc(QC_PARAM_SHORT_LABELS[p.key])}</th>`).join('')}${wo.productType==='Tinned Copper Wire'?'<th>Tin</th>':''}<th>By/Time</th>${can('editDeleteOrder')?'<th>Actions</th>':''}</tr></thead>
          <tbody>${wo.finalQC.slice().reverse().map(q=>{ const result = q.rejected>0 && q.accepted>0 ? 'Partial' : (q.rejected>0?'Reject':'Pass'); return `

              <td style="white-space:nowrap;">${result==='Pass'?`<span class="pill complete"><span class="pill-dot"></span>Pass</span>`:result==='Partial'?`<span class="pill partial"><span class="pill-dot"></span>Partial</span>`:`<span class="pill rejected"><span class="pill-dot"></span>Reject</span>`}</td>
              ${qcParamsForProduct(wo.productType).map(p=>`<td class="mono" style="text-align:center;">${q[p.key]!=null?q[p.key]:'—'}</td>`).join('')}

              <td style="font-size:11px; color:var(--ink-soft); white-space:nowrap;">${esc(q.by||'—')}<br>${fmtDT(q.timestamp)}</td>

            </tr>`;}).join('')}</tbody></table></div>`}
          <div style="margin-top:8px; font-size:11.5px; color:var(--ink-soft);">Qty currently ready to present for Final QC: <b class="mono">${round1(d.readyForFinalQC)} kg</b> (in-process passed, not yet final-QC'd).</div>
          ${!wo.closed && can('addQC') && d.readyForFinalQC>0 ? `<div style="margin-top:10px;"><button class="btn btn-steel btn-sm" data-open-modal="addFinalQC" data-item="${o.id}|${wo.id}">+ Record Final QC</button></div>` : ''}
        </div>

        <div class="log-block"><h3>Dispatch Log</h3>
          ${wo.dispatchEntries.length===0 ? `<div class="log-empty">No dispatch transactions yet.</div>` : `

          <tbody>${wo.dispatchEntries.slice().reverse().map(dd=>`<tr><td class="mono">${dd.qty} kg</td><td class="mono">${esc(dd.docNo)}</td><td class="mono">${esc(dd.reelsType)||'—'}</td><td class="mono">${dd.reelsCount!=null?dd.reelsCount:'—'}</td><td style="font-size:11px; color:var(--ink-soft);">${esc(dd.by||'—')} · ${fmtDT(dd.timestamp)}</td></tr>`).join('')}</tbody></table></div>`}
          ${!wo.closed && can('addDispatch') && d.maxDispatchNow>0 && d.status!=='Pending Accounts' ? `<div style="margin-top:10px;"><button class="btn btn-steel btn-sm" data-open-modal="addDispatch" data-item="${o.id}|${wo.id}">+ Record Dispatch</button></div>` : ''}
          ${!wo.closed && d.status==='Pending Accounts' ? `<div class="log-empty" style="margin-top:10px;">Awaiting invoicing in Accounts before this can be dispatched.</div>` : ''}
          ${!wo.closed && can('addDispatch') && d.maxDispatchNow<=0 && d.status!=='Completed' ? `<div class="log-empty">No final-QC-accepted stock currently available to dispatch.</div>` : ''}
        </div>

        <div class="log-block"><h3>Rejected by Customer</h3>
          ${(!wo.customerRejections || wo.customerRejections.length===0) ? `<div class="log-empty">No customer rejections recorded.</div>` : `
          <div class="table-scroll"><table><thead><tr><th>Qty</th><th>Action</th><th>Remarks</th><th>By/Time</th></tr></thead>
          <tbody>${wo.customerRejections.slice().reverse().map(c=>`
            <tr>
              <td class="mono">${c.qty} kg</td>
              <td>${c.action==='Reproduction' ? `<span class="pill ongoing"><span class="pill-dot"></span>Reproduction</span>` : `<span class="pill inactive"><span class="pill-dot"></span>Closed</span>`}</td>
              <td style="font-size:12px;">${esc(c.remarks)}</td>
              <td style="font-size:11px; color:var(--ink-soft);">${esc(c.by)}<br>${fmtDT(c.timestamp)}</td>
            </tr>`).join('')}</tbody></table></div>`}
          ${!wo.closed && can('recordCustomerRejection') && wo.dispatchEntries.length>0 ? `<div style="margin-top:10px;"><button class="btn btn-red btn-sm" data-open-modal="recordCustomerRejection" data-item="${o.id}|${wo.id}">+ Record Customer Rejection</button></div>` : ''}
          ${!wo.closed && wo.dispatchEntries.length===0 ? `<div class="log-empty">Available once material has been dispatched.</div>` : ''}
        </div>

        <div class="log-block"><h3>Item-Wise Activity Log</h3>
          ${itemActivityLogHTML(wo)}
        </div>
      </div>
    </div>`;
  }

  /* ================= PURCHASE LIST + DRAWER ================= */
  function prPill(status){
    if(status==='Approved') return `<span class="pill pill-status complete" title="Approved"><span class="pill-dot"></span>APR</span>`;
    if(status==='Rejected') return `<span class="pill pill-status rejected" title="Rejected"><span class="pill-dot"></span>REJ</span>`;
    if(status==='Returned for Correction') return `<span class="pill pill-status partial" title="Returned for Correction"><span class="pill-dot"></span>RFC</span>`;
    if(status==='Pending MD Approval') return `<span class="pill pill-status ready" title="Pending MD Approval"><span class="pill-dot"></span>PMA</span>`;

    return `

        <div class="stage-track">
          ${stages.map((s,i)=>`<div class="stage ${i<idx?'done':(i===idx?'current':'')}"><div class="dotc">${i<idx?'✓':i+1}</div><div class="lbl">${s}</div></div>`).join('')}

            <div class="spec-grid">
              <div class="spec-item"><div class="k">Client / Vendor</div><div class="v">${esc(pr.client||'—')}</div></div>
              <div class="spec-item"><div class="k">Estimated Price</div><div class="v">₹${pr.estPrice?Number(pr.estPrice).toLocaleString('en-IN'):'—'}</div></div>

          ${canDoPurchaseAction ? `<button class="btn btn-steel btn-sm" data-open-modal="purchaseAction" data-pr="${pr.id}">${pr.status==='Returned for Correction'?'Update & Resubmit to MD':'Complete & Send to MD'}</button>` : ''}

          ${pr.status==='Approved' || pr.status==='Rejected' ? `

              <div class="spec-item"><div class="k">Decision By</div><div class="v">${esc(pr.approvedBy)}</div></div>

              <div class="spec-grid">

                <div class="spec-item"><div class="k">Created By</div><div class="v">${esc(po.createdBy)}</div></div>
              </div>
              ${po.remarks?`<div style="font-size:12.5px; margin-bottom:8px;"><b>Remarks:</b> ${esc(po.remarks)}</div>`:''}
              <div style="display:flex; gap:8px; flex-wrap:wrap;">
                <button class="btn btn-ghost btn-sm" data-po-pdf="${po.id}">Download PDF</button>

              </div>
            `;
          })()}
        </div>
      </div>
    </div>`;
