  function modalHTML(){
    const t = state.modal.type;
    if(t==='createOrder') return modalCreateOrder();
    if(t==='createSalesOrder') return modalSalesOrderForm(null);
    if(t==='editSalesOrder') return modalSalesOrderForm(state.salesOrders.find(so=>so.id===state.modal.soId));
    if(t==='createPO') return modalPurchaseOrderForm(null, state.purchase.find(p=>p.id===state.modal.prId));
    if(t==='editPO'){ const po = state.purchaseOrders.find(p=>p.id===state.modal.poId); return modalPurchaseOrderForm(po, state.purchase.find(p=>p.id===po.prId)); }
    if(t==='createClient') return modalClientForm(null);
    if(t==='editClient') return modalClientForm(state.clients.find(s=>s.id===state.modal.clientId));
    if(t==='addSOItem') return modalSOItemForm();
    if(t==='addOrderItem') return modalAddOrderItem();
    if(t==='editOrder') return modalEditOrder();
    if(t==='editExistingItem') return modalEditExistingItem();
    if(t==='confirmDelete') return modalConfirmDelete();
    if(t==='addItemToOrder') return modalAddOrderItem();
    if(t==='addInProcessQC') return modalAddInProcessQC();
    if(t==='addFinalQC') return modalAddFinalQC();
    if(t==='addDispatch') return modalAddDispatch();
    if(t==='createPR') return modalCreatePR();
    if(t==='purchaseAction') return modalPurchaseAction();
    if(t==='createCAPA') return modalCreateCAPA();
    if(t==='editCAPA') return modalEditCAPA();
    if(t==='createUser') return modalUserForm(null);
    if(t==='editUser') return modalUserForm(state.users.find(u=>u.id===state.modal.userId));
    if(t==='resetPw') return modalResetPw();
    if(t==='changeMyPassword') return modalChangeMyPassword();

    return '';
  }

  function modalConfirmDelete(){
    const { deleteKind, orderId, itemId, userId, capaId, qcId, clientId, passId } = state.modal;
    const order = orderId ? state.orders.find(o=>o.id===orderId) : null;
    const item = (deleteKind==='item' || deleteKind==='inProcessQC' || deleteKind==='finalQC') ? order?.items.find(it=>it.id===itemId) : null;
    const qcEntry = deleteKind==='inProcessQC' ? item?.inProcessQC.find(q=>q.id===qcId) : deleteKind==='finalQC' ? item?.finalQC.find(q=>q.id===qcId) : null;
    const u0 = deleteKind==='user' ? state.users.find(x=>x.id===userId) : null;
    const c0 = deleteKind==='capa' ? state.capa.find(x=>x.id===capaId) : null;
    const cl0 = deleteKind==='client' ? state.clients.find(x=>x.id===state.modal.clientId) : null;
    const messages = {
      order: 'Are you sure you want to delete this entire order? All items under this order will be deleted.',
      item: 'Are you sure you want to delete this item? This action cannot be undone.',
      user: 'Are you sure you want to delete this user? This cannot be undone.',
      capa: 'Are you sure you want to delete this CAPA report? This action cannot be undone.',
      client: 'Are you sure you want to delete this client? Their saved commercial terms will no longer be available to auto-fill future Sales Orders. Existing Sales Orders and Work Orders already made for this client are not affected.',
      inProcessQC: 'Are you sure you want to delete this In-Process QC entry? This action cannot be undone and will recalculate the item\'s status.',
      prodPass: 'Are you sure you want to delete this production pass? This action cannot be undone.',
      finalQC: 'Are you sure you want to delete this Final QC entry? This action cannot be undone and will recalculate the item\'s dispatchable quantity and status.',
    };
    const finalQcResult = deleteKind==='finalQC' && qcEntry ? (qcEntry.rejected>0 && qcEntry.accepted>0 ? 'Partial' : (qcEntry.rejected>0 ? 'Reject' : 'Pass')) : '';
    const subtitle = deleteKind==='order' ? (order ? `${order.id} — ${esc(order.customer)}` : '')
      : deleteKind==='item' ? (item ? `${esc(item.itemSerialNo)} — ${esc(item.productType)}` : '')
      : deleteKind==='inProcessQC' ? (qcEntry ? `${esc(item.itemSerialNo)} — ${qcEntry.qty} kg, ${esc(qcEntry.result)}` : '')
      : deleteKind==='finalQC' ? (qcEntry ? `${esc(item.itemSerialNo)} — ${qcEntry.qtyChecked} kg, ${esc(finalQcResult)}` : '')
      : deleteKind==='user' ? (u0 ? esc(u0.fullName) : '')
      : deleteKind==='capa' ? (c0 ? esc(c0.capaNo||c0.id) : '')
      : deleteKind==='client' ? (cl0 ? `${cl0.id} — ${esc(cl0.clientName)}` : '') : '';
    return modalWrap('Confirm Delete', `
      ${subtitle ? `<div class="mono" style="font-size:12px; color:var(--ink-soft); margin-bottom:10px;">${subtitle}</div>` : ''}
      <div style="font-size:14px; line-height:1.5;">${esc(messages[deleteKind]||'Are you sure you want to delete this? This action cannot be undone.')}</div>
    `, `<button class="btn" data-close-modal-generic="1">Cancel</button><button class="btn btn-red" data-submit="confirmDelete">Confirm Delete</button>`);
  }

  let pendingCapaPhotos = [];
  function compressImage(file){
    return new Promise((resolve,reject)=>{
      const reader = new FileReader();
      reader.onload = (e)=>{
        const img = new Image();
        img.onload = ()=>{
          const maxDim = 480;
          let w=img.width, h=img.height;
          if(w>h && w>maxDim){ h=Math.round(h*maxDim/w); w=maxDim; } else if(h>maxDim){ w=Math.round(w*maxDim/h); h=maxDim; }
          const canvas = document.createElement('canvas');
          canvas.width=w; canvas.height=h;
          canvas.getContext('2d').drawImage(img,0,0,w,h);
          resolve(canvas.toDataURL('image/jpeg',0.6));
        };
        img.onerror = reject;
        img.src = e.target.result;
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

      if(state.modal && state.modal.type==='addOrderItem'){

      }
      if(state.modal && state.modal.type==='createOrder'){
        draftOrderFields = {poNumber:'',poDate:'',customer:'',remarks:''};
        draftOrderItems = [];
      }
      if(state.modal && (state.modal.type==='createSalesOrder' || state.modal.type==='editSalesOrder')){
        draftSOFields = {customer:'',poNumber:'',poDate:'',paymentTerms:'',reelsDepositFeeApplicable:false,reelMakes:[],packagingSheetDepositApplicable:false,packagingSheetPrice:null};
        draftSOItems = [];
      }
      state.modal=null; render();
    });
    root.querySelectorAll('[data-stop]').forEach(el=> el.onclick = (e)=> e.stopPropagation());

    // conditional item spec fields (Add Item form)
    const ptSel = document.getElementById('processTypeSelect');
    if(ptSel){
      // Bunch Lay and Twist Direction only apply when Process Type is Bunched — hidden entirely
      // for Parallel. The compact grid auto-flows whatever's visible, so no manual reordering is
      // needed here.
      const toggle = ()=>{
        const isParallel = ptSel.value==='Parallel';
        document.getElementById('bunchLayField').style.display = isParallel?'none':'';
        document.getElementById('twistDirField').style.display = isParallel?'none':'';
      };
      ptSel.onchange = toggle; toggle();
    }
    // conditional Packaging Sheet amount field — only shown when "Deposit" is chosen
    const pkgSheetSel = document.getElementById('packagingSheetSelect');
    if(pkgSheetSel){
      const amountField = document.getElementById('packagingSheetAmountField');
      const toggle = ()=> amountField.style.display = pkgSheetSel.value==='Deposit' ? '' : 'none';
      pkgSheetSel.onchange = toggle; toggle();
    }
    // Work Order item's own Packaging Type — repopulates the Reel Size sub-selector (same
    // PACKAGING_REEL_SIZES map as everywhere else), and auto-fetches the per-reel deposit rate
    // from this order's linked Sales Order (which itself came from the Client) whenever the type
    // changes. The fetched rate always stays a plain editable number afterward — this only ever
    // copies a starting value in, never re-syncs on its own later.
    const itemPkgTypeSel = document.getElementById('itemPackagingTypeSelect');
    if(itemPkgTypeSel){
      const reelSizeField = document.getElementById('itemReelSizeField');
      const reelSizeSel = document.getElementById('itemReelSizeSelect');
      const rateInput = document.getElementById('itemReturnableRateInput');
      const rateHint = document.getElementById('itemReturnableRateHint');
      const currentReelSize = reelSizeSel.getAttribute('data-current') || '';
      let reelSizeInitialized = false;
      const toggleReelSize = ()=>{
        const sizes = PACKAGING_REEL_SIZES[itemPkgTypeSel.value] || null;
        if(!sizes){ reelSizeField.style.display = 'none'; return; }
        reelSizeField.style.display = '';
        const preselect = reelSizeInitialized ? '' : currentReelSize;
        reelSizeSel.innerHTML = '<option value="">Not set</option>' + sizes.map(s=>`<option value="${s}" ${s===preselect?'selected':''}>${s}</option>`).join('');
        reelSizeInitialized = true;
      };
      const autoFetchRate = ()=>{
        let order = null;
        if(state.modal.orderId) order = state.orders.find(o=>o.id===state.modal.orderId);
        else if(state.modal.itemKey) order = state.orders.find(o=>o.id===state.modal.itemKey.split('|')[0]);
        const fetched = fetchReelsDepositRateFromClient(order, itemPkgTypeSel.value, reelSizeSel.value);
        if(fetched!=null){
          rateInput.value = fetched;
          if(rateHint) rateHint.textContent = '(auto-filled from Client Details — editable)';
        } else if(rateHint){
          rateHint.textContent = '(optional)';
        }
      };
      itemPkgTypeSel.onchange = ()=>{ toggleReelSize(); autoFetchRate(); };
      reelSizeSel.onchange = autoFetchRate;
      toggleReelSize();
    }
    // Reels Deposit Amount = No. of Reels × Deposit Rate — recalculated live whenever either
    // input changes, while remaining a normal editable field the rest of the time (typing
    // directly into it is never overwritten except by changing Reels or Rate again).
    const itemReelsInput = document.getElementById('itemReelsInput');
    const itemRateInput = document.getElementById('itemReturnableRateInput');
    const itemAmountInput = document.getElementById('itemReturnableAmountInput');
    if(itemReelsInput && itemRateInput && itemAmountInput){
      const recalc = ()=>{
        const reels = Number(itemReelsInput.value), rate = Number(itemRateInput.value);
        if(itemReelsInput.value && itemRateInput.value && !isNaN(reels) && !isNaN(rate)) itemAmountInput.value = round1(reels*rate);
      };
      itemReelsInput.onchange = recalc;
      itemRateInput.onchange = recalc;
    }
    // Client form: Internal Commercial Details toggles
    const reelsDepSel = document.getElementById('reelsDepositApplicableSelect');
    if(reelsDepSel){
      const section = document.getElementById('reelMakesSection');
      const toggle = ()=> section.style.display = reelsDepSel.value==='yes' ? '' : 'none';
      reelsDepSel.onchange = toggle; toggle();
    }
    const pkgSheetDepSel = document.getElementById('pkgSheetDepositApplicableSelect');
    if(pkgSheetDepSel){
      const priceField = document.getElementById('pkgSheetPriceField');
      const toggle = ()=> priceField.style.display = pkgSheetDepSel.value==='yes' ? '' : 'none';
      pkgSheetDepSel.onchange = toggle; toggle();
    }
    const ownershipSel = document.getElementById('ownershipTypeSelect');
    if(ownershipSel){
      const otherField = document.getElementById('ownershipOtherField');
      const toggle = ()=> otherField.style.display = ownershipSel.value==='Others' ? '' : 'none';
      ownershipSel.onchange = toggle; toggle();
    }
    // Reel Makes — a repeatable list rendered and edited entirely via direct DOM manipulation
    // (not a full app render()), so adding/removing a row never risks losing whatever the user
    // has already typed into the client's other fields elsewhere in this same form.
    // Reel rates — grouped by Reel Type (MS / Plastic / Wooden / Basket MS / Corrugated Basket).
    // Adding a type expands every size that type offers, each with its own rate input, matching
    // how deposit rates are actually structured (per exact size, never one common rate for a
    // whole type). Rendered and edited entirely via direct DOM manipulation (not a full app
    // render()), so adding/removing a type never risks losing anything else typed into this form.
    const reelMakesRowsEl = document.getElementById('reelMakesRows');
    if(reelMakesRowsEl){
      const refreshTypePicker = ()=>{
        const picker = document.getElementById('newReelTypeSelect');
        const addedTypes = new Set([...reelMakesRowsEl.querySelectorAll('.reel-type-section')].map(s=>s.getAttribute('data-reel-type')));
        const remaining = PACKAGING_TYPES.filter(t=>!addedTypes.has(t));
        if(picker) picker.innerHTML = remaining.map(t=>`<option value="${t}">${t}</option>`).join('');
        const addBtn = document.getElementById('addReelMakeBtn');
        if(addBtn) addBtn.disabled = remaining.length===0;
      };
      // Sourced from the Client record when this is the Client Form, or from the in-progress
      // Sales Order draft (which may already hold auto-fetched or previously-entered values) when
      // this is the Sales Order form — same element IDs, same wiring, different data source.
      const existingClient = state.modal.clientId ? state.clients.find(c=>c.id===state.modal.clientId) : null;
      const sourceMakes = existingClient ? existingClient.reelMakes : (state.modal.type==='createSalesOrder'||state.modal.type==='editSalesOrder' ? draftSOFields.reelMakes : null);
      const initialTypes = (sourceMakes && sourceMakes.length) ? [...new Set(sourceMakes.map(m=>m.reelMake))] : [PACKAGING_TYPES[0]];
      reelMakesRowsEl.innerHTML = initialTypes.map(t=>reelTypeSectionHtml(t, (sourceMakes||[]).filter(m=>m.reelMake===t))).join('');
      refreshTypePicker();
      reelMakesRowsEl.addEventListener('click', (e)=>{
        if(e.target.classList.contains('reel-type-remove')){
          e.target.closest('.reel-type-section').remove();
          refreshTypePicker();
        }
      });
      const addBtn = document.getElementById('addReelMakeBtn');
      if(addBtn) addBtn.onclick = ()=>{
        const picker = document.getElementById('newReelTypeSelect');
        if(!picker || !picker.value) return;
        reelMakesRowsEl.insertAdjacentHTML('beforeend', reelTypeSectionHtml(picker.value, []));
        refreshTypePicker();
      };
    }
    // Sales Order: the moment the Customer field resolves to an existing Client (typed exactly,
    // or picked from the datalist), auto-fetch that client's saved commercial terms into the
    // draft. This only ever COPIES values in — it never re-runs on its own later, so it can never
    // silently rewrite an order after the fact; editing the field again re-triggers it, same as
    // any other autofill.
    const soCustomerEl = document.getElementById('soCustomerField');
    if(soCustomerEl){
      let lastFetchedFor = null;
      const doFetch = ()=>{
        const name = soCustomerEl.value.trim();
        if(!name || name === lastFetchedFor) return; // avoid redundant re-fetches when change+blur both fire
        const terms = fetchClientCommercialTerms(name);
        if(!terms) return; // no matching Client yet (e.g. a brand-new customer) — nothing to fetch, stay silent
        lastFetchedFor = name;
        const current = readSOFieldsFromForm();
        draftSOFields = { ...current, ...terms };
        render();
      };
      // Fires automatically the moment the Customer field resolves to a saved Client — on
      // 'change' (datalist selection or typing then moving on) and 'blur' (covers any browser/
      // interaction pattern where 'change' alone might not reliably fire) — no manual action needed.
      soCustomerEl.addEventListener('change', doFetch);
      soCustomerEl.addEventListener('blur', doFetch);
    }
    // conditional In-Process QC Hold/Reject qty fields
    const ipqcSel = document.getElementById('ipqcResultSelect');
    if(ipqcSel){
      const toggle = ()=>{
        const holdField = document.getElementById('ipqcHoldQtyField'), rejField = document.getElementById('ipqcRejectQtyField');
        holdField.style.display = ipqcSel.value==='Hold' ? '' : 'none';
        rejField.style.display = ipqcSel.value==='Reject' ? '' : 'none';
        holdField.querySelector('input').required = ipqcSel.value==='Hold';
        rejField.querySelector('input').required = ipqcSel.value==='Reject';
      };
      ipqcSel.onchange = toggle; toggle();
    }
    // Result options are jointly controlled by two independent checks:
    // (1) Tin Coating Reddishness/Blackish always blocks Pass (bad tin coating alone disqualifies it).
    // (2) Measured CR/Elongation outside the ±tolerance band also blocks Pass, regardless of tin
    //     coating — a wire can have perfect tin coating and still fail on CR/elongation.
    // Neither condition being triggered leaves Pass/Hold/Reject fully open to the inspector's judgment.
    const ipqcTinSel = document.getElementById('ipqcTinCoatingSelect');
    const ipqcCrInput = document.getElementById('ipqcCrInput');
    const ipqcElongInput = document.getElementById('ipqcElongInput');
    const ipqcCopperWtInput = document.getElementById('ipqcCopperWtInput');
    const ipqcPerSulphateSel = document.getElementById('ipqcPerSulphateSelect');
    if(ipqcSel && (ipqcTinSel || ipqcCrInput || ipqcCopperWtInput)){
      const passOpt = ipqcSel.querySelector('option[value="Pass"]');
      const warnBox = document.getElementById('ipqcToleranceWarning');
      const itemKey = state.modal && state.modal.itemKey;
      const {item: ipqcWo} = itemKey ? findItem(itemKey) : {item:null};
      const recompute = ()=>{
        const tinBad = ipqcTinSel ? (ipqcTinSel.value==='Reddishness' || ipqcTinSel.value==='Blackish') : false;
        const crVal = (ipqcCrInput && ipqcCrInput.value!=='') ? Number(ipqcCrInput.value) : null;
        const elongVal = (ipqcElongInput && ipqcElongInput.value!=='') ? Number(ipqcElongInput.value) : null;
        const toleranceBad = ipqcWo ? crElongOutOfTolerance(ipqcWo, crVal, elongVal) : false;
        const copperWtVal = (ipqcCopperWtInput && ipqcCopperWtInput.value!=='') ? Number(ipqcCopperWtInput.value) : null;
        const copperWtToleranceBad = ipqcWo ? copperWtOutOfTolerance(ipqcWo, copperWtVal) : false;
        const perSulphateBad = ipqcPerSulphateSel ? ipqcPerSulphateSel.value==='Fail' : false;
        const passBlocked = tinBad || toleranceBad || copperWtToleranceBad || perSulphateBad;
        if(passOpt) passOpt.disabled = passBlocked;
        if(warnBox) warnBox.style.display = (toleranceBad || copperWtToleranceBad) ? '' : 'none';
        if(passBlocked && ipqcSel.value==='Pass'){ ipqcSel.value = 'Reject'; }
        ipqcSel.onchange();
      };
      if(ipqcTinSel) ipqcTinSel.onchange = recompute;
      if(ipqcCrInput) ipqcCrInput.oninput = recompute;
      if(ipqcElongInput) ipqcElongInput.oninput = recompute;
      if(ipqcCopperWtInput) ipqcCopperWtInput.oninput = recompute;
      if(ipqcPerSulphateSel) ipqcPerSulphateSel.onchange = recompute;
      recompute();
    }
    // Tin Coating controls Final QC quantities: Reddishness/Blackish forces a non-zero rejected qty
    const fqcTinSel = document.getElementById('fqcTinCoatingSelect');
    if(fqcTinSel){
      const acceptedInput = document.getElementById('fqcAccepted');
      const rejectedInput = document.getElementById('fqcRejected');
      const checkedInput = document.getElementById('fqcQtyChecked');
      const toggleFqcTin = ()=>{
        const bad = fqcTinSel.value==='Reddishness' || fqcTinSel.value==='Blackish';
        if(bad){
          const checkedVal = Number(checkedInput.value)||0;
          acceptedInput.value = 0;
          acceptedInput.max = 0;
          rejectedInput.value = checkedVal || rejectedInput.value || 0;
        } else {
          acceptedInput.removeAttribute('max');
        }
      };
      fqcTinSel.onchange = toggleFqcTin;
    }
    // conditional user section field
    const roleSel = document.getElementById('userRoleSelect');
    if(roleSel){
      const toggle = ()=>{ document.getElementById('userSectionField').style.display = roleSel.value==='ProductionManager' ? '' : 'none'; };
      roleSel.onchange = toggle; toggle();
    }
    // CAPA photo inputs
    const camInput = document.getElementById('capaCameraInput');
    const upInput = document.getElementById('capaUploadInput');
    if(camInput) camInput.onchange = async (e)=>{ for(const f of e.target.files){ pendingCapaPhotos.push(await compressImage(f)); } renderCapaPhotoPreview(); };
    if(upInput) upInput.onchange = async (e)=>{ for(const f of e.target.files){ pendingCapaPhotos.push(await compressImage(f)); } renderCapaPhotoPreview(); };
    renderCapaPhotoPreview();
    // PR photo inputs
    const prCamInput = document.getElementById('prCameraInput');
    const prUpInput = document.getElementById('prUploadInput');
    if(prCamInput) prCamInput.onchange = async (e)=>{ for(const f of e.target.files){ pendingPRPhotos.push(await compressImage(f)); } renderPRPhotoPreview(); };
    if(prUpInput) prUpInput.onchange = async (e)=>{ for(const f of e.target.files){ pendingPRPhotos.push(await compressImage(f)); } renderPRPhotoPreview(); };
    renderPRPhotoPreview();

    root.querySelectorAll('[data-start-prod]').forEach(el=> el.onclick = async ()=>{
      const [orderId, itemId] = el.getAttribute('data-start-prod').split('|');
      const wo = state.orders.find(o=>o.id===orderId)?.items.find(i=>i.id===itemId);
      if(!wo) return;
      const prevStatus = deriveItemStatus(wo);
      wo.productionStarted = true;
      logItemActivity(wo, 'Production Started', prevStatus, deriveItemStatus(wo), null, currentUser().fullName, '');
      const order = state.orders.find(o=>o.id===orderId);
      logOrderAudit(order, `Production started on ${wo.itemSerialNo}`);
      try{
        await saveOrder(orderId);
        showToast('Production started.');
      }catch(err){
        wo.productionStarted = false; // undo the local change since the save was blocked
        showToast(err.message || 'Could not save — please reload and try again.');
      }
      render();
    });

    root.querySelectorAll('[data-pause-prod]').forEach(el=> el.onclick = async ()=>{
      const [orderId, itemId] = el.getAttribute('data-pause-prod').split('|');
      const order = state.orders.find(o=>o.id===orderId);
      const wo = order?.items.find(i=>i.id===itemId);
      if(!wo) return;
      const prevStatus = deriveItemStatus(wo);
      wo.productionPaused = true;
      logItemActivity(wo, 'Production Paused', prevStatus, deriveItemStatus(wo), null, currentUser().fullName, '');
      logOrderAudit(order, `Production paused on ${wo.itemSerialNo}`);
      try{
        await saveOrder(orderId);
        showToast('Production paused.');
      }catch(err){
        wo.productionPaused = false;
        showToast(err.message || 'Could not save — please reload and try again.');
      }
      render();
    });

    root.querySelectorAll('[data-resume-prod]').forEach(el=> el.onclick = async ()=>{
      const [orderId, itemId] = el.getAttribute('data-resume-prod').split('|');
      const order = state.orders.find(o=>o.id===orderId);
      const wo = order?.items.find(i=>i.id===itemId);
      if(!wo) return;
      const prevStatus = deriveItemStatus(wo);
      wo.productionPaused = false;
      logItemActivity(wo, 'Production Resumed', prevStatus, deriveItemStatus(wo), null, currentUser().fullName, '');
      logOrderAudit(order, `Production resumed on ${wo.itemSerialNo}`);
      try{
        await saveOrder(orderId);
        showToast('Production resumed.');
      }catch(err){
        wo.productionPaused = true;
        showToast(err.message || 'Could not save — please reload and try again.');
      }
      render();
    });

    root.querySelectorAll('[data-toggle-active]').forEach(el=> el.onclick = async ()=>{
      const u = state.users.find(x=>x.id===el.getAttribute('data-toggle-active'));
      u.status = u.status==='Active' ? 'Inactive' : 'Active';
      const selfDeactivated = u.status==='Inactive' && state.currentUserId===u.id;
      await saveUsers(); showToast(u.fullName+' is now '+u.status+'.'); render();
      if(selfDeactivated) doLogout();
    });
    root.querySelectorAll('[data-delete-user]').forEach(el=> el.onclick = ()=>{
      if(!can('manageUsers')) return;
      const id = el.getAttribute('data-delete-user');
      if(state.users.length<=1){ showToast('Cannot delete the last remaining user.'); return; }
      state.modal = { type:'confirmDelete', deleteKind:'user', userId:id, error:null };
      render();
    });

    root.querySelectorAll('[data-md-decide]').forEach(el=> el.onclick = async ()=>{
      if(!canApprovePR()){ showToast('You do not have permission to approve requisitions.'); return; }
      const pr = state.purchase.find(p=>p.id===el.getAttribute('data-md-decide'));
      const decision = el.getAttribute('data-decision');
      let remarks = '';
      if(decision!=='Approved'){ remarks = prompt(decision==='Rejected' ? 'Reason for rejection (optional):' : 'Correction needed (optional):') || ''; }
      const previous = {status:pr.status, approvedBy:pr.approvedBy, approvalAt:pr.approvalAt, approvalRemarks:pr.approvalRemarks};
      pr.status = decision; pr.approvedBy = currentUser().fullName; pr.approvalAt = nowIso(); pr.approvalRemarks = remarks;
      try{
        await savePR();
        showToast(decision==='Approved' ? 'Requisition approved.' : (decision==='Rejected' ? 'Requisition rejected.' : 'Returned to Purchase Department for correction.'));
      }catch(e){
        Object.assign(pr, previous);
        showToast('Could not save — check your internet connection and try again.');
      }
      render();
    });

    root.querySelectorAll('[data-capa-docx]').forEach(el=> el.onclick=(e)=> capaExportDocx(el.getAttribute('data-capa-docx'), e.target));
    root.querySelectorAll('[data-capa-pdf]').forEach(el=> el.onclick=(e)=> capaExportPdf(el.getAttribute('data-capa-pdf'), e.target));
    root.querySelectorAll('[data-po-pdf]').forEach(el=> el.onclick=(e)=> downloadPurchaseOrderPdf(el.getAttribute('data-po-pdf'), e.target));
    root.querySelectorAll('[data-wo-pdf]').forEach(el=> el.onclick=(e)=> downloadWorkOrderPdf(el.getAttribute('data-wo-pdf'), e.target));
    root.querySelectorAll('[data-wo-docx]').forEach(el=> el.onclick=(e)=> downloadWorkOrderDocx(el.getAttribute('data-wo-docx'), e.target));
    root.querySelectorAll('[data-download-client-form]').forEach(el=> el.onclick=(e)=> downloadBlankClientForm(e.target));
    root.querySelectorAll('[data-capa-email]').forEach(el=> el.onclick=()=> capaExport(el.getAttribute('data-capa-email'),'email'));
    root.querySelectorAll('[data-capa-whatsapp]').forEach(el=> el.onclick=()=> capaExport(el.getAttribute('data-capa-whatsapp'),'whatsapp'));
    root.querySelectorAll('[data-delete-capa]').forEach(el=> el.onclick = ()=>{
      const id = el.getAttribute('data-delete-capa');
      state.modal = { type:'confirmDelete', deleteKind:'capa', capaId:id, error:null };
      render();
    });

    root.querySelectorAll('[data-submit]').forEach(el=> el.onclick = ()=> handleSubmit(el.getAttribute('data-submit')));
  }

  function capaText(c){
    return `CAPA REPORT — ${c.capaNo||c.id}
Customer: ${c.customer}
Date: ${fmtDate(c.createdAt)}
Target Completion: ${fmtDate(c.targetDate)}
Closure Status: ${c.closureStatus}

Customer Complaint:
${c.complaint}

Corrective Action:
${c.corrective}

Preventive Action:
${c.preventive}

Responsibility: ${c.responsibility}
${c.photos && c.photos.length ? c.photos.length+' photo(s) attached — see the Word/PDF export for images.' : ''}`;
  }
  function capaExport(id,mode){
    const c = state.capa.find(x=>x.id===id); if(!c) return;
    const text = capaText(c);
    if(mode==='email'){
      window.open(`mailto:?subject=${encodeURIComponent('CAPA Report — '+(c.capaNo||c.id))}&body=${encodeURIComponent(text)}`, '_blank');
    } else if(mode==='whatsapp'){
      window.open(`https://wa.me/?text=${encodeURIComponent(text)}`, '_blank');
    }
  }

  /* ================= CAPA WORD / PDF EXPORT ================= */
  function xmlEscape(s){
    return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&apos;');
  }
  function getImageDims(dataUrl){
    return new Promise((resolve,reject)=>{
      const img = new Image();
      img.onload = ()=> resolve({w:img.naturalWidth||1, h:img.naturalHeight||1});
      img.onerror = ()=> reject(new Error('image failed to load'));
      img.src = dataUrl;
    });
  }
  function scaledEMU(natW,natH,maxPx){
    const scale = Math.min(1, maxPx/natW);
    return { cx: Math.round(natW*scale*9525), cy: Math.round(natH*scale*9525) };
  }
  function docxParaLabelValue(label,value){
    const lines = String(value||'—').split(/\r?\n/).map(xmlEscape);
    const valueRuns = lines.map((l,i)=> (i>0?'<w:br/>':'') + `<w:t xml:space="preserve">${l}</w:t>`).join('');
    return `<w:p><w:pPr><w:spacing w:after="80"/></w:pPr><w:r><w:rPr><w:b/></w:rPr><w:t xml:space="preserve">${xmlEscape(label)}: </w:t></w:r><w:r>${valueRuns}</w:r></w:p>`;
  }
  function docxHeading(text){
    return `<w:p><w:pPr><w:spacing w:before="240" w:after="100"/></w:pPr><w:r><w:rPr><w:b/><w:sz w:val="24"/></w:rPr><w:t xml:space="preserve">${xmlEscape(text)}</w:t></w:r></w:p>`;
  }
  function docxBlock(text){
    const lines = String(text||'—').split(/\r?\n/).map(xmlEscape);
    const runs = lines.map((l,i)=> (i>0?'<w:br/>':'') + `<w:t xml:space="preserve">${l}</w:t>`).join('');
    return `<w:p><w:pPr><w:spacing w:after="120"/></w:pPr><w:r>${runs}</w:r></w:p>`;
  }
  function docxImagePara(rId,cx,cy,picId,spacingAfter){
    spacingAfter = spacingAfter==null ? 160 : spacingAfter;
    return `<w:p><w:pPr><w:jc w:val="center"/><w:spacing w:after="${spacingAfter}"/></w:pPr><w:r><w:drawing><wp:inline distT="0" distB="0" distL="0" distR="0"><wp:extent cx="${cx}" cy="${cy}"/><wp:docPr id="${picId}" name="Picture ${picId}"/><a:graphic xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main"><a:graphicData uri="http://schemas.openxmlformats.org/drawingml/2006/picture"><pic:pic xmlns:pic="http://schemas.openxmlformats.org/drawingml/2006/picture"><pic:nvPicPr><pic:cNvPr id="${picId}" name="Picture ${picId}"/><pic:cNvPicPr/></pic:nvPicPr><pic:blipFill><a:blip r:embed="${rId}"/><a:stretch><a:fillRect/></a:stretch></pic:blipFill><pic:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="${cx}" cy="${cy}"/></a:xfrm><a:prstGeom prst="rect"><a:avLst/></a:prstGeom></pic:spPr></pic:pic></a:graphicData></a:graphic></wp:inline></w:drawing></w:r></w:p>`;
  }
  // A simple bordered table for the Work Order export — header row shaded, one row per data
  // item. colWidths is in twips (1440 = 1 inch); must have one entry per header/cell.
  function docxTable(headers, rows, colWidths){
    const totalWidth = colWidths.reduce((a,b)=>a+b,0);
    const gridCols = colWidths.map(w=>`<w:gridCol w:w="${w}"/>`).join('');
    const border = `<w:top w:val="single" w:sz="4" w:color="CCCCCC"/><w:left w:val="single" w:sz="4" w:color="CCCCCC"/><w:bottom w:val="single" w:sz="4" w:color="CCCCCC"/><w:right w:val="single" w:sz="4" w:color="CCCCCC"/><w:insideH w:val="single" w:sz="4" w:color="CCCCCC"/><w:insideV w:val="single" w:sz="4" w:color="CCCCCC"/>`;
    const headerRow = `<w:tr>${headers.map((h,i)=>{
      const lines = String(h).split('\n').map(xmlEscape);
      const runs = lines.map((l,li)=> (li>0?'<w:br/>':'') + `<w:t xml:space="preserve">${l}</w:t>`).join('');
      return `<w:tc><w:tcPr><w:tcW w:w="${colWidths[i]}" w:type="dxa"/><w:shd w:val="clear" w:fill="EFF1F0"/></w:tcPr><w:p><w:pPr><w:jc w:val="center"/></w:pPr><w:r><w:rPr><w:b/><w:sz w:val="16"/></w:rPr>${runs}</w:r></w:p></w:tc>`;
    }).join('')}</w:tr>`;
    const bodyRows = rows.map(row=>`<w:tr>${row.map((cell,i)=>`<w:tc><w:tcPr><w:tcW w:w="${colWidths[i]}" w:type="dxa"/></w:tcPr><w:p><w:r><w:rPr><w:sz w:val="16"/></w:rPr><w:t xml:space="preserve">${xmlEscape(cell==null?'—':String(cell))}</w:t></w:r></w:p></w:tc>`).join('')}</w:tr>`).join('');
    return `<w:tbl><w:tblPr><w:tblW w:w="${totalWidth}" w:type="dxa"/><w:tblBorders>${border}</w:tblBorders></w:tblPr><w:tblGrid>${gridCols}</w:tblGrid>${headerRow}${bodyRows}</w:tbl><w:p/>`;
  }

  async function buildCapaDocxBlob(c){
    const zipFiles = [];
    zipFiles.push(zipTextPart('[Content_Types].xml',
      `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Default Extension="png" ContentType="image/png"/><Default Extension="jpeg" ContentType="image/jpeg"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/></Types>`));
    zipFiles.push(zipTextPart('_rels/.rels',
      `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>`));

    const rels = [];
    let rIdCounter = 2, picIdCounter = 1, bodyXml = '';

    try{

      const rId = 'rId'+(rIdCounter++);

      rels.push({id:rId, target:'media/logo.png'});
      bodyXml += docxImagePara(rId,cx,cy,picIdCounter++,600);
    }catch(e){ /* logo optional */ }

    bodyXml += `<w:p><w:pPr><w:jc w:val="center"/><w:spacing w:after="40"/></w:pPr><w:r><w:rPr><w:b/><w:sz w:val="32"/></w:rPr><w:t>CAPA REPORT</w:t></w:r></w:p>`;
    bodyXml += `<w:p><w:pPr><w:jc w:val="center"/><w:spacing w:after="240"/></w:pPr><w:r><w:rPr><w:i/><w:color w:val="6E7071"/></w:rPr><w:t xml:space="preserve">${xmlEscape(c.capaNo||c.id)}</w:t></w:r></w:p>`;

    bodyXml += docxParaLabelValue('Customer', c.customer);
    bodyXml += docxParaLabelValue('Date', fmtDate(c.createdAt));
    bodyXml += docxParaLabelValue('Target Completion', fmtDate(c.targetDate));
    bodyXml += docxParaLabelValue('Closure Status', c.closureStatus);

    bodyXml += docxHeading('Customer Complaint'); bodyXml += docxBlock(c.complaint);
    bodyXml += docxHeading('Corrective Action'); bodyXml += docxBlock(c.corrective);
    bodyXml += docxHeading('Preventive Action'); bodyXml += docxBlock(c.preventive);
    bodyXml += docxParaLabelValue('Responsibility', c.responsibility);

    if(c.photos && c.photos.length){
      bodyXml += docxHeading('Photographic Evidence');
      for(let i=0;i<c.photos.length;i++){

          const dims = await getImageDims(c.photos[i]);
          const {cx,cy} = scaledEMU(dims.w,dims.h,420);
          const rId = 'rId'+(rIdCounter++);
          zipFiles.push(zipBase64Part(`word/media/photo${i+1}.jpeg`, c.photos[i].split(',')[1]));
          rels.push({id:rId, target:`media/photo${i+1}.jpeg`});
          bodyXml += docxImagePara(rId,cx,cy,picIdCounter++);
        }catch(e){ /* skip unreadable photo */ }
      }
    }

    const documentXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main" xmlns:wp="http://schemas.openxmlformats.org/drawingml/2006/wordprocessingDrawing" xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main" xmlns:pic="http://schemas.openxmlformats.org/drawingml/2006/picture" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><w:body>${bodyXml}<w:sectPr><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="1134" w:right="1134" w:bottom="1134" w:left="1134"/></w:sectPr></w:body></w:document>`;
    zipFiles.push(zipTextPart('word/document.xml', documentXml));

    const relsXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${rels.map(r=>`<Relationship Id="${r.id}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="${r.target}"/>`).join('')}</Relationships>`;
    zipFiles.push(zipTextPart('word/_rels/document.xml.rels', relsXml));

    const zipBytes = buildZip(zipFiles);
    return new Blob([zipBytes], {type:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'});
  }

  // Builds the full Work Order document body shared by the PDF and Word exports — every field
  // currently on an item (spec, QC ranges, packaging, rate, status) plus its Production Passes
  // sub-table (including every die-size/pass combination), for every item on this Work Order.
  function workOrderExportData(order){
    return order.items.map(wo=>{
      const d = deriveItem(wo);
      const passes = (wo.productionPasses||[]).map((p,idx)=>({
        sr: idx+1, inputSize: p.inputSize||'—', type: p.type||'—', mcNo: p.mcNo||'—',
        tolerance: p.sizeTolerance||'—',
        qtyKM: p.qtyKM!=null?p.qtyKM:'—', reels: p.noOfReels!=null?p.noOfReels:'—',
        dieSize: p.dieSize||'—',
        remarks: p.remarks||'—',
      }));
      return {
        itemSerialNo: wo.itemSerialNo, productType: wo.productType, processType: wo.processType,
        wireSpec: `${wo.numWires}/${wo.wireSize}`,
        bunchLay: wo.processType==='Parallel' ? 'Not applicable (Parallel)' : `${wo.bunchLay||'—'} Twist · ${wo.twistDir||'—'}`,
        orderQty: round1(wo.orderQty)+' kg',
        crRange: maxOnlyLabel(wo.crMax,' Ω'),
        elongSingle: minOnlyLabel(wo.elongSingleMin,'%'),
        elongBunched: null,
        copperWt: wo.copperWtMin!=null ? rangeLabel(wo.copperWtMin,wo.copperWtMax,' KG/KM') : null,
        dispatchTolerance: `±${wo.dispatchTolerancePct}%`,
        productGrade: wo.productGrade||'—', deliveryDate: wo.deliveryDate?fmtDate(wo.deliveryDate):'—',
        packagingType: wo.packagingType||'—', reelsRequired: wo.reelsRequiredApprox!=null?wo.reelsRequiredApprox:'—',
        returnableRate: wo.returnableRate!=null?'₹'+wo.returnableRate:'—',
        packagingSheet: wo.packagingSheetChoice==='Deposit' ? `Deposit (₹${wo.packagingSheetAmount!=null?wo.packagingSheetAmount:'—'})` : (wo.packagingSheetChoice||'—'),
        rate: wo.rate!=null?'₹'+wo.rate:'—', status: d.status,
        passes,
      };
    });
  }

  // jsPDF is loaded on demand, right when someone actually exports a PDF — not eagerly at page
  // load — for the same reason the Firestore SDK itself is: a static <script> tag for an
  // external CDN resource is processed by the browser before any of our own error handling
  // exists, so its failure (blocked network, restrictive sandbox, anything) has nowhere to be
  // caught and can surface as a generic, unhelpful "Script error." Loading it lazily, inside our
  // own try/catch, means a failure here is just a clear toast message — never a page-load crash.
  let jsPdfLoadPromise = null;
  function loadJsPdf(){
    try{
      if(window.jspdf && window.jspdf.jsPDF) return Promise.resolve();
      if(jsPdfLoadPromise) return jsPdfLoadPromise;
      jsPdfLoadPromise = new Promise((resolve, reject)=>{
        try{
          const script = document.createElement('script');
          script.src = 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
          script.onload = () => resolve();
          script.onerror = () => { jsPdfLoadPromise = null; reject(new Error('Could not load the PDF library — check your internet connection and try again.')); };
          document.head.appendChild(script);
        }catch(e){ jsPdfLoadPromise = null; reject(new Error('Could not load the PDF library — check your internet connection and try again.')); }
      });
      return jsPdfLoadPromise;
    }catch(e){
      return Promise.reject(new Error('Could not load the PDF library — check your internet connection and try again.'));
    }
  }

  async function capaExportPdf(id, btnEl){
    const c = state.capa.find(x=>x.id===id); if(!c) return;
    const originalText = btnEl.textContent;
    btnEl.disabled = true; btnEl.textContent = 'Generating…';
    try{
      await loadJsPdf();
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF({unit:'pt', format:'a4'});
      const pageW = doc.internal.pageSize.getWidth();
      const pageH = doc.internal.pageSize.getHeight();
      const margin = 40;
      let y = margin;

      try{
        const dims = await getImageDims(LOGO_LIGHT_DATA_URI);
        const w = Math.min(130, dims.w);
        const h = dims.h * (w/dims.w);
        doc.addImage(LOGO_LIGHT_DATA_URI, 'PNG', (pageW-w)/2, y, w, h);
        y += h + 42;
      }catch(e){ /* logo optional */ }

      doc.setFont('helvetica','bold'); doc.setFontSize(18); doc.setTextColor(20,20,20);
      doc.text('CAPA REPORT', pageW/2, y, {align:'center'}); y += 20;
      doc.setFont('helvetica','italic'); doc.setFontSize(10); doc.setTextColor(110,112,113);
      doc.text(c.capaNo||c.id, pageW/2, y, {align:'center'}); y += 26;
      doc.setTextColor(20,20,20);

      function checkPageBreak(need){ if(y+need > pageH-margin){ doc.addPage(); y = margin; } }
      function labelValue(label,value){
        checkPageBreak(18);
        doc.setFont('helvetica','bold'); doc.setFontSize(11);
        doc.text(label+':', margin, y);
        doc.setFont('helvetica','normal');
        doc.text(String(value||'—'), margin+130, y);
        y += 18;
      }
      function heading(text){
        y += 8; checkPageBreak(20);
        doc.setFont('helvetica','bold'); doc.setFontSize(13);
        doc.text(text, margin, y); y += 16;
      }
      function block(text){
        doc.setFont('helvetica','normal'); doc.setFontSize(11);
        const lines = doc.splitTextToSize(String(text||'—'), pageW-margin*2);
        lines.forEach(line=>{ checkPageBreak(16); doc.text(line, margin, y); y += 16; });
        y += 8;
      }

      labelValue('Customer', c.customer);
      labelValue('Date', fmtDate(c.createdAt));
      labelValue('Target Completion', fmtDate(c.targetDate));
      labelValue('Closure Status', c.closureStatus);

      heading('Customer Complaint'); block(c.complaint);
      heading('Corrective Action'); block(c.corrective);
      heading('Preventive Action'); block(c.preventive);
      labelValue('Responsibility', c.responsibility);

      if(c.photos && c.photos.length){
        heading('Photographic Evidence');
        for(const photo of c.photos){
          try{
            const dims = await getImageDims(photo);
            const maxW = pageW - margin*2;
            let w = Math.min(maxW, dims.w), h = dims.h*(w/dims.w);
            const maxH = 260;
            if(h > maxH){ h = maxH; w = dims.w*(h/dims.h); }
            checkPageBreak(h+14);
            doc.addImage(photo, 'JPEG', margin, y, w, h);
            y += h + 14;
          }catch(e){ /* skip unreadable photo */ }
        }
      }

      doc.save(`CAPA_${(c.capaNo||c.id)}_${c.customer.replace(/\s+/g,'_')}.pdf`);
      showToast('CAPA PDF downloaded.');
    }catch(e){
      showToast('Could not generate the PDF.');
    }
    btnEl.disabled = false; btnEl.textContent = originalText;
  }

  // A blank, printable template — not a filled record — meant to be handed or emailed to a
  // client so they can write in their own details by hand (or fill it digitally) and send it
  // back. Deliberately includes every field a Manager/MD/Accounts user would see, since the
  // client is the one filling it in, not any particular KMG staff role.
  async function downloadBlankClientForm(btnEl){
    const originalText = btnEl.textContent;
    btnEl.disabled = true; btnEl.textContent = 'Generating…';
    try{
      await loadJsPdf();
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF({unit:'pt', format:'a4'});
      const pageW = doc.internal.pageSize.getWidth();
      const margin = 48;
      let y = margin;

      try{
        const dims = await getImageDims(LOGO_LIGHT_DATA_URI);
        const w = Math.min(120, dims.w);
        const h = dims.h * (w/dims.w);
        doc.addImage(LOGO_LIGHT_DATA_URI, 'PNG', (pageW-w)/2, y, w, h);
        y += h + 24;
      }catch(e){ /* logo optional */ }

      doc.setFont('helvetica','bold'); doc.setFontSize(16); doc.setTextColor(20,20,20);
      doc.text('CLIENT DETAILS FORM', pageW/2, y, {align:'center'}); y += 18;
      doc.setFont('helvetica','normal'); doc.setFontSize(9.5); doc.setTextColor(110,112,113);
      doc.text('Please fill in your details below and return this form to KMG Wiring Solutions.', pageW/2, y, {align:'center'}); y += 24;

      // Every field is a label ABOVE a bordered box BELOW — not a bare underline — so the
      // printed form reads like an actual form to fill in, matching the reference style.
      const colGap = 18;
      const halfW = (pageW - margin*2 - colGap) / 2;
      const labelGap = 14; // space between the label baseline and the top of its box
      const rowGap = 14;   // space after a box before the next label starts
      function box(label, x, w, h){
        doc.setFont('helvetica','bold'); doc.setFontSize(9.5); doc.setTextColor(20,20,20);
        doc.text(label, x, y);
        doc.setDrawColor(150,150,150); doc.setLineWidth(0.9);
        doc.rect(x, y+6, w, h);
      }
      function fullRow(label, h){ box(label, margin, pageW-margin*2, h); y += 6+h+rowGap; }
      function pairRow(label1, label2, h){
        box(label1, margin, halfW, h);
        box(label2, margin+halfW+colGap, halfW, h);
        y += 6+h+rowGap;
      }
      function sectionHeading(text){
        y += 6;
        doc.setFont('helvetica','bold'); doc.setFontSize(11.5); doc.setTextColor(7,123,142);
        doc.text(text, margin, y);
        doc.setDrawColor(7,123,142); doc.setLineWidth(1); doc.line(margin, y+5, pageW-margin, y+5);
        y += 22;
      }
      // Real tick-box style options laid out across two rows so nothing gets cramped — the
      // client ticks one square rather than writing anything, except for "Others" which gets its
      // own blank line to specify.
      function checkboxRow(items){
        let x = margin;
        doc.setFont('helvetica','normal'); doc.setFontSize(9.5); doc.setTextColor(20,20,20);
        items.forEach(item=>{
          doc.setDrawColor(110,110,110); doc.setLineWidth(0.9);
          doc.rect(x, y-8, 9, 9);
          x += 13;
          doc.text(item.label, x, y);
          x += doc.getTextWidth(item.label) + (item.blank ? 6 : 26);
          if(item.blank){
            doc.setDrawColor(180,180,180); doc.setLineWidth(0.7);
            doc.line(x, y+1, x+130, y+1);
            x += 130 + 20;
          }
        });

  /* ================= FORM SUBMIT ================= */
  // Generic fix for a real bug: since the whole modal re-renders from scratch whenever an error
  // is shown, a plain re-render would regenerate the form with its original default values,
  // making it look like everything the user typed just vanished. Instead, we snapshot every
  // field's current value right before the error re-render, then write those exact values back
  // into the freshly-rendered form afterward — so only the specific missing/invalid field needs
  // fixing, and nothing else the user already filled in is lost. Works for any modal's form
  // without needing to know its specific fields, since it just walks form.elements generically.
  function captureFormValues(form){
    if(!form) return null;
    const values = {};
    Array.from(form.elements).forEach(el=>{
      if(!el.name) return;
      if(el.type==='checkbox' || el.type==='radio') values[el.name] = el.checked;
      else if(el.multiple) values[el.name] = Array.from(el.selectedOptions).map(o=>o.value);
      else values[el.name] = el.value;
    });
    return values;
  }
  function restoreFormValues(form, values){
    if(!form || !values) return;
    Array.from(form.elements).forEach(el=>{
      if(!el.name || !(el.name in values)) return;
      if(el.type==='checkbox' || el.type==='radio') el.checked = values[el.name];
      else if(el.multiple){ const vals = values[el.name]; Array.from(el.options).forEach(o=> o.selected = vals.includes(o.value)); }
      else el.value = values[el.name];
    });
  }
  async function handleSubmit(action){
    const type = action || (state.modal && state.modal.type);
    const openForm = document.querySelector('.modal-backdrop form');
    const preservedValues = captureFormValues(openForm);
    try{
      if(type==='saveDraftItem') submitSaveDraftItem();
      else if(type==='createOrder') await submitCreateOrder();
      else if(type==='addItemToOrder') await submitAddItemToOrder();
      else if(type==='editOrder') await submitEditOrder();
      else if(type==='editExistingItem') await submitEditExistingItem();
      else if(type==='confirmDelete') await performConfirmedDelete();
      else if(type==='addInProcessQC') await submitAddInProcessQC();
      else if(type==='addFinalQC') await submitAddFinalQC();
      else if(type==='addDispatch') await submitAddDispatch();
      else if(type==='createSalesOrder') await submitCreateSalesOrder();
      else if(type==='saveSOItemDone') submitSaveSOItemAndDone();
      else if(type==='saveSOItemAddAnother') submitSaveSOItemAndAddAnother();
      else if(type==='createClient') await submitCreateClient();
      else if(type==='editClient') await submitEditClient();
      else if(type==='editSalesOrder') await submitEditSalesOrder();
      else if(type==='createPO') await submitCreatePO();
      else if(type==='editPO') await submitEditPO();
      else if(type==='createPR') await submitCreatePR();
      else if(type==='purchaseAction') await submitPurchaseAction();
      else if(type==='createCAPA') await submitCreateCAPA();
      else if(type==='editCAPA') await submitEditCAPA();
      else if(type==='createUser') await submitUserForm(false);
      else if(type==='editUser') await submitUserForm(true);
      else if(type==='resetPw') await submitResetPw();
      else if(type==='changeMyPassword') await submitChangeMyPassword();
      else if(type==='custRejectReproduce') await submitCustomerRejection('Reproduction');
      else if(type==='custRejectClose') await submitCustomerRejection('Close');
    }catch(err){
      state.modal.error = err.message || 'Something went wrong.';
      render();
      restoreFormValues(document.querySelector('.modal-backdrop form'), preservedValues);
    }
  }
  function readForm(id){ const form=document.getElementById(id); const data={}; new FormData(form).forEach((v,k)=>data[k]=v); return data; }

  // The Wire Size field now accepts "wires/size" in one box (e.g. "168/0.240") instead of two
  // separate fields — parsed here into the same numWires/wireSize the rest of the app already
  // expects, so nothing downstream needs to change. A plain size with no "/" is treated as a
  // single wire (numWires = 1), which covers the common Parallel case.
  function parseWireSizeInput(raw){
    const s = (raw||'').trim();
    const slash = s.indexOf('/');
    if(slash===-1) return { numWires: 1, wireSize: s };
    const n = parseInt(s.slice(0,slash).trim(), 10);
    return { numWires: isNaN(n)||n<1 ? 1 : n, wireSize: s.slice(slash+1).trim() };
  }
  function readItemFormFields(f){
    if(!f.wireSizeCombined || !f.orderQty) throw new Error('Please fill all required item fields.');
    const {numWires, wireSize} = parseWireSizeInput(f.wireSizeCombined);
    if(!wireSize) throw new Error('Please enter a wire size.');
    return {
      productType:f.productType, processType:f.processType,
      wireSize, numWires, bunchLay: f.processType==='Parallel' ? '' : f.bunchLay,
      twistDir: f.processType==='Parallel' ? '' : f.twistDir,
      orderQty:Number(f.orderQty),
      crMax: f.crMax ? Number(f.crMax) : null,
      elongSingleMin: f.elongSingleMin ? Number(f.elongSingleMin) : null,
      copperWtMin: f.copperWtMin ? Number(f.copperWtMin) : null, copperWtMax: f.copperWtMax ? Number(f.copperWtMax) : null,
      dispatchTolerancePct: f.dispatchTolerancePct ? Number(f.dispatchTolerancePct) : 1,
      productGrade:f.productGrade, deliveryDate:f.deliveryDate,
      packagingType: f.packagingType||'', reelSize: f.reelSize||'',
      reelsRequiredApprox: f.reelsRequiredApprox ? Number(f.reelsRequiredApprox) : null,
      returnableRate: f.returnableRate ? Number(f.returnableRate) : null,
      returnableAmount: f.returnableAmount ? Number(f.returnableAmount) : null,
      packagingSheetChoice: f.packagingSheetChoice||'',
      packagingSheetAmount: f.packagingSheetAmount ? Number(f.packagingSheetAmount) : null,
      rate: f.rate ? Number(f.rate) : null,
      // Bundle whatever passes were built in-memory in the Add Item form's own Production
      // Planning editor — each one properly minted via mkProductionPass() here (id, createdBy,
      // createdAt) so it's indistinguishable from a pass added later through the drawer.
      productionPasses: draftItemPasses.map(p=> mkProductionPass({...p, createdBy: currentUser().fullName})),
    };
  }

  // Saves an item into the in-progress draft list (order not yet created) — used from the New Order flow
  function submitSaveDraftItem(){
    const f = readForm('formAddItem');
    const spec = readItemFormFields(f);
    const editIdx = state.modal.editDraftIdx;
    if(editIdx!=null && editIdx>=0){
      draftOrderItems[editIdx] = {...draftOrderItems[editIdx], ...spec};
    } else {
      draftOrderItems.push({itemSerialNo: generateItemSerial(draftOrderFields.poNumber), ...spec});
    }
    state.modal = { type:'createOrder', error:null };
    render();
  }
  // Sales Order item — only the 5 fields Sales actually sets (Product Type, Process Type,
  // Wire/Size, Grade, Rate); everything else is filled in later at Work Order stage.
  // Shared save logic for the SO Item sub-form — returns the parsed spec, or throws a validation
  // error. Used by both "Add Item" (stay in the item-entry loop) and "Done" (save and return).
  function parseAndSaveSOItem(){
    const f = readForm('formSOItem');
    if(!f.wireSizeCombined) throw new Error('Please enter wire size.');
    const {numWires, wireSize} = parseWireSizeInput(f.wireSizeCombined);
    if(!wireSize) throw new Error('Please enter a wire size.');
    const spec = {
      productType:f.productType, processType:f.processType, wireSize, numWires,
      productGrade:f.productGrade, rate: f.rate ? Number(f.rate) : null,
    };
    const editIdx = state.modal.editDraftIdx;
    if(editIdx!=null && editIdx>=0){
      draftSOItems[editIdx] = spec;
    } else {
      draftSOItems.push(spec);
    }
  }
  // "+ Add Item": saves the item just entered, then immediately opens a fresh blank entry for
  // the next one — previously added items stay exactly as they are, never touched.
  function submitSaveSOItemAndAddAnother(){
    parseAndSaveSOItem();
    state.modal = { type:'addSOItem', editDraftIdx:null, soId:state.modal.soId||null, error:null };
    render();
  }
  // "Done": saves the item just entered, then returns to the Sales Order screen showing every
  // item collected so far.
  function submitSaveSOItemAndDone(){
    parseAndSaveSOItem();
    state.modal = { type: state.modal.soId ? 'editSalesOrder' : 'createSalesOrder', soId: state.modal.soId||null, error:null };
    render();
  }

  async function submitCreateOrder(){
    const f = readForm('formCreateOrder');
    if(!f.customer) throw new Error('Customer Name is required.');
    if(draftOrderItems.length===0) throw new Error('Add at least one item before creating the order.');
    const by = currentUser().fullName;
    const items = draftOrderItems.map(spec=> mkItem({...spec, itemSerialNo:spec.itemSerialNo, createdBy:by}));
    const order = mkOrder({poNumber:f.poNumber, poDate:f.poDate, customer:f.customer, remarks:f.remarks, createdBy:by, items});
    state.orders.push(order);
    logOrderAudit(order, `Order created with ${items.length} item(s)`);
    await saveOrder(order.id, true);
    draftOrderFields = {poNumber:'',poDate:'',customer:'',remarks:''};
    draftOrderItems = [];
    state.modal=null;
    showToast(`Order created with ${items.length} item(s).`);
    render();
  }

  async function submitAddItemToOrder(){
    const f = readForm('formAddItem');
    const spec = readItemFormFields(f);
    const order = state.orders.find(o=>o.id===state.modal.orderId);
    if(!order) throw new Error('Order not found.');
    const it = mkItem({...spec, itemSerialNo: generateItemSerial(order.poNumber), createdBy: currentUser().fullName});
    order.items.push(it);
    logOrderAudit(order, `Item ${it.itemSerialNo} added to order`);
    await saveOrder(order.id); state.modal=null;
    showToast(`Item ${it.itemSerialNo} added to order.`); render();
  }

  async function submitEditOrder(){
    if(!can('editDeleteOrder')) throw new Error('You do not have permission to edit orders.');
    const o = state.orders.find(x=>x.id===state.modal.orderId);
    if(!o) throw new Error('Order not found.');
    const f = readForm('formEditOrder');
    if(!f.customer) throw new Error('Customer Name is required.');
    o.poNumber = f.poNumber||''; o.poDate = f.poDate||''; o.customer = f.customer; o.remarks = f.remarks||'';
    logOrderAudit(o, 'Order details edited (PO/Date/Customer/Remarks)');
    await saveOrder(o.id); state.modal=null; showToast('Order updated.'); render();
  }

  async function submitEditExistingItem(){
    if(!can('editDeleteOrder')) throw new Error('You do not have permission to edit items.');

  async function performConfirmedDelete(){
    const { deleteKind, orderId, itemId, userId, capaId, qcId, clientId, passId } = state.modal;
    if((deleteKind==='order' || deleteKind==='item' || deleteKind==='inProcessQC' || deleteKind==='finalQC') && !can('editDeleteOrder')) throw new Error('You do not have permission to delete this.');
    if(deleteKind==='user' && !can('manageUsers')) throw new Error('You do not have permission to delete users.');
    if(deleteKind==='client' && !canViewClientContacts()) throw new Error('You do not have permission to delete clients.');
    if(deleteKind==='order'){
      state.orders = state.orders.filter(o=>o.id!==orderId);
      if(state.drawerOrder===orderId || (state.drawerItem && state.drawerItem.split('|')[0]===orderId)){ goBack(); }
      state.modal = null;
      await saveOrder(orderId, true); // order removed locally — saveOrder deletes its storage row
      showToast('Order deleted.');
      render();
      return;
    }
    if(deleteKind==='user'){
      const selfDeleted = state.currentUserId===userId;
      state.users = state.users.filter(u=>u.id!==userId);
      state.modal = null;
      await saveUsers();
      showToast('User deleted.');
      render();
      if(selfDeleted) doLogout();
      return;
    }
    if(deleteKind==='capa'){
      state.capa = state.capa.filter(c=>c.id!==capaId);
      state.modal = null;
      await saveCAPA();
      showToast('CAPA report deleted.');
      render();
      return;
    }
    if(deleteKind==='client'){
      const before = state.clients.slice();
      state.clients = state.clients.filter(c=>c.id!==clientId);
      state.modal = null;
      try{
        await saveClients();
      }catch(e){
        state.clients = before; // roll back so the list doesn't show a deletion that never actually saved
        showToast('Could not delete the client — check your internet connection and try again.');
        render();
        return;
      }
      showToast('Client deleted.');
      render();
      return;
    }
    if(deleteKind==='inProcessQC'){
      const order = state.orders.find(o=>o.id===orderId);
      const wo = order?.items.find(it=>it.id===itemId);
      if(!wo){ state.modal=null; render(); return; }
      const entry = wo.inProcessQC.find(q=>q.id===qcId);
      wo.inProcessQC = wo.inProcessQC.filter(q=>q.id!==qcId);
      if(entry) logItemActivity(wo, 'In-Process QC entry deleted (was: '+entry.result+', '+entry.qty+' kg)', deriveItemStatus(wo), deriveItemStatus(wo), 0, currentUser().fullName, 'Deleted by '+currentUser().fullName);
      logOrderAudit(order, `In-Process QC entry deleted on ${wo.itemSerialNo}`);
      state.modal = null;
      await saveOrder(orderId);
      showToast('In-Process QC entry deleted.');
      render();
      return;
    }
    if(deleteKind==='prodPass'){
      const order = state.orders.find(o=>o.id===orderId);
      const wo = order?.items.find(it=>it.id===itemId);
      if(!wo){ state.modal=null; render(); return; }
      const removed = (wo.productionPasses||[]).find(p=>p.id===passId);
      const previousPasses = (wo.productionPasses||[]).slice();
      wo.productionPasses = (wo.productionPasses||[]).filter(p=>p.id!==passId);
      logOrderAudit(order, `Production pass deleted on ${wo.itemSerialNo}`);
      state.modal = null;
      try{
        await saveOrder(orderId);
        showToast('Pass deleted.');
      }catch(e){
        wo.productionPasses = previousPasses;
        showToast(e.message || 'Could not delete — please try again.');
      }
      render();
      return;
    }
    if(deleteKind==='finalQC'){
      const order = state.orders.find(o=>o.id===orderId);
      const wo = order?.items.find(it=>it.id===itemId);
      if(!wo){ state.modal=null; render(); return; }
      const entry = wo.finalQC.find(q=>q.id===qcId);
      wo.finalQC = wo.finalQC.filter(q=>q.id!==qcId);
      if(entry){
        const result = entry.rejected>0 && entry.accepted>0 ? 'Partial' : (entry.rejected>0 ? 'Reject' : 'Pass');
        logItemActivity(wo, 'Final QC entry deleted (was: '+result+', '+entry.qtyChecked+' kg checked)', deriveItemStatus(wo), deriveItemStatus(wo), 0, currentUser().fullName, 'Deleted by '+currentUser().fullName);
      }
      logOrderAudit(order, `Final QC entry deleted on ${wo.itemSerialNo}`);
      state.modal = null;
      await saveOrder(orderId);
      showToast('Final QC entry deleted.');
      render();
      return;
    }
    // deleteKind === 'item'
    const order = state.orders.find(o=>o.id===orderId);
    if(!order){ state.modal=null; render(); return; }
    order.items = order.items.filter(it=>it.id!==itemId);
    let orderAlsoRemoved = false;
    if(order.items.length===0){
      state.orders = state.orders.filter(o=>o.id!==orderId);
      orderAlsoRemoved = true;
    }
    if(!orderAlsoRemoved) logOrderAudit(order, `Item deleted from order`);
    if(state.drawerItem === orderId+'|'+itemId){ goBack(); }
    else if(orderAlsoRemoved && state.drawerOrder===orderId){ goBack(); }
    state.modal = null;
    await saveOrder(orderId, orderAlsoRemoved); // if the order itself is gone, force (nothing to conflict-check)
    showToast(orderAlsoRemoved ? 'Item deleted — the order had no items left, so it was removed too.' : 'Item deleted.');
    render();
  }

  function findItem(itemKey){
    const [orderId, itemId] = (itemKey||'').split('|');
    const order = state.orders.find(o=>o.id===orderId);
    const item = order ? order.items.find(i=>i.id===itemId) : null;
    return {order, item};
  }

  // Direct acceptable-range check — is the measured value inside [min, max]? Much simpler than
  // the old target±tolerance% math, and matches how the range is actually entered on the item
  // form now. Used both to drive the live form (disable Pass, suggest Reject) and to enforce the
  // same rule server-side on submit.
  function crElongOutOfTolerance(wo, crVal, elongVal){
    const crBad = crVal!=null && wo.crMax!=null && crVal > wo.crMax;
    const elongBad = elongVal!=null && wo.elongSingleMin!=null && elongVal < wo.elongSingleMin;
    return crBad || elongBad;
  }
  // Same in-range check, for Copper WT (KG/KM) against its own dedicated min/max.
  function copperWtOutOfTolerance(wo, copperWtVal){
    if(copperWtVal==null || wo.copperWtMin==null || wo.copperWtMax==null) return false;
    return copperWtVal < wo.copperWtMin || copperWtVal > wo.copperWtMax;
  }
  async function submitAddInProcessQC(){
    const {order, item:wo} = findItem(state.modal.itemKey);
    if(!wo) throw new Error('Item not found.');
    const f = readForm('formAddInProcessQC');
    const qty = Number(f.qty);
    if(!qty||qty<=0) throw new Error('Enter a valid batch quantity.');
    const tinCoating = (wo.productType==='Tinned Copper Wire') ? (f.tinCoating||'OK') : '';
    const tinBad = tinCoating==='Reddishness' || tinCoating==='Blackish';
    const result = f.result;
    const crVal = f.cr ? Number(f.cr) : null;
    const elongVal = f.elong ? Number(f.elong) : null;
    const toleranceBad = crElongOutOfTolerance(wo, crVal, elongVal);
    const copperWt = f.copperWt ? Number(f.copperWt) : null;
    const copperWtToleranceBad = copperWtOutOfTolerance(wo, copperWt);
    const perSulphateTest = (wo.productType==='Tinned Copper Wire') ? (f.perSulphateTest || '') : '';
    const perSulphateBad = perSulphateTest === 'Fail';
    if(tinBad && result==='Pass') throw new Error(`Tin Coating "${tinCoating}" cannot be recorded with Result = Pass. Choose Hold or Reject.`);
    if(toleranceBad && result==='Pass') throw new Error('Measured CR/Elongation is outside the tolerance band — choose Hold or Reject instead of Pass.');
    if(copperWtToleranceBad && result==='Pass') throw new Error('Measured Copper WT (KG/KM) is outside the tolerance band — choose Hold or Reject instead of Pass.');
    if(perSulphateBad && result==='Pass') throw new Error('Per Sulphate Test is marked Fail — choose Hold or Reject instead of Pass.');
    const holdQty = Number(f.holdQty||0), rejectQty = Number(f.rejectQty||0);
    if(result==='Hold' && (!holdQty || holdQty<=0)) throw new Error('Enter a valid Hold Quantity.');
    if(result==='Reject' && (!rejectQty || rejectQty<=0)) throw new Error(tinBad ? `Tin Coating "${tinCoating}" requires a Rejected Quantity greater than zero.` : 'Enter a valid Rejected Quantity.');
    if((result==='Hold'||result==='Reject') && !f.remarks) throw new Error('Remarks are required for Hold or Reject.');
    const tinCoatingResult = tinCoating ? (tinCoating==='OK' ? 'Pass' : 'Rejected') : '';
    const prevStatus = deriveItemStatus(wo);
    wo.inProcessQC.push({id:uid('IPQC'), qty, result, holdQty: result==='Hold'?holdQty:0, rejectQty: result==='Reject'?rejectQty:0,
      tinCoating, tinCoatingResult, cr: f.cr?Number(f.cr):null, elong: f.elong?Number(f.elong):null, copperWt, perSulphateTest, spool:f.spool||'', remarks:f.remarks||'', timestamp:nowIso(), by:currentUser().fullName});
    const newStatus = deriveItemStatus(wo);
    logItemActivity(wo, 'In-Process QC: '+result+(tinCoating?' · Tin Coating: '+tinCoating:''), prevStatus, newStatus, qty, currentUser().fullName, f.remarks||'');
    logOrderAudit(order, `In-Process QC recorded on ${wo.itemSerialNo}: ${result} (${qty} kg)`);
    if(result==='Hold' || result==='Reject'){
      await createQcNotification(order, wo, {
        type: result==='Hold' ? 'qc_hold' : 'qc_reject',
        qty: result==='Hold' ? holdQty : rejectQty,
        reason: f.remarks||'',
        qcStage: 'In-Process QC',
      });
    }
    await saveOrder(order.id); state.modal=null;
    showToast(`In-Process QC recorded — ${result} (${qty} kg).`);
    render();
  }

  async function submitAddFinalQC(){
    const {order, item:wo} = findItem(state.modal.itemKey);
    if(!wo) throw new Error('Item not found.');
    const f = readForm('formAddFinalQC');
    const accepted = Number(f.accepted), rejected = Number(f.rejected);
    if(isNaN(accepted)||accepted<0||isNaN(rejected)||rejected<0) throw new Error('Enter valid Accepted and Rejected quantities.');
    if(accepted + rejected <= 0) throw new Error('Enter an Accepted or Rejected quantity greater than zero.');
    const qtyChecked = accepted + rejected, qtyPresented = qtyChecked;
    const d = deriveItem(wo);
    if(qtyChecked > d.readyForFinalQC + 1e-9) throw new Error(`Accepted + Rejected cannot exceed the ${round1(d.readyForFinalQC)} kg currently ready for Final QC.`);
    const tinCoating = (wo.productType==='Tinned Copper Wire') ? f.tinCoating : '';
    const tinBad = tinCoating==='Reddishness' || tinCoating==='Blackish';
    if(tinBad && !(rejected>0)) throw new Error(`Tin Coating "${tinCoating}" is a rejection — enter a Rejected Quantity greater than zero. This batch cannot be marked fully Accepted.`);
    const tinCoatingResult = tinCoating ? (tinCoating==='OK' ? 'Pass' : 'Rejected') : '';
    const perSulphateTest = (wo.productType==='Tinned Copper Wire') ? (f.perSulphateTest || '') : '';
    const copperWt = f.copperWt ? Number(f.copperWt) : null;
    const params = qcParamsForProduct(wo.productType);
    const paramValues = {};
    params.forEach(p=>{ paramValues[p.key] = f[p.key] ? Number(f[p.key]) : null; });
    const prevStatus = deriveItemStatus(wo);
    wo.finalQC.push({id:uid('FQC'), qtyPresented, qtyChecked, accepted, rejected, tinCoating, tinCoatingResult, copperWt, perSulphateTest, ...paramValues, remarks:f.remarks||'', timestamp:nowIso(), by:currentUser().fullName});
    const result = rejected>0 && accepted>0 ? 'Partial' : (rejected>0 ? 'Reject' : 'Pass');
    const newStatus = deriveItemStatus(wo);
    logItemActivity(wo, 'Final QC: '+result+(tinCoating?' · Tin Coating: '+tinCoating:''), prevStatus, newStatus, qtyChecked, currentUser().fullName, f.remarks||'');
    logOrderAudit(order, `Final QC recorded on ${wo.itemSerialNo}: ${result}`);
    if(rejected>0){
      await createQcNotification(order, wo, {
        type: 'qc_reject',
        qty: rejected,
        reason: f.remarks||'',
        qcStage: 'Final QC',
      });
    }
    await saveOrder(order.id); state.modal=null;
    showToast(`Final QC recorded — ${result}.`);
    render();
  }

  async function submitAddDispatch(){
    const {order, item:wo} = findItem(state.modal.itemKey);
    if(!wo) throw new Error('Item not found.');
    const f = readForm('formAddDispatch');
    const qty = Number(f.qty);
    if(!qty||qty<=0) throw new Error('Enter a valid dispatch quantity.');
    if(!f.docNo) throw new Error('Invoice No. is required.');
    if(f.reelsCount==='' || f.reelsCount==null || Number(f.reelsCount)<0) throw new Error('Enter a valid No. of Reels / Basket.');
    const d = deriveItem(wo);
    if(d.status==='Pending Accounts') throw new Error('This item is awaiting invoicing in Accounts. Dispatch becomes available once Accounts clicks "Invoice Generated".');
    if(qty > d.remainingDispatchableHardCap + 1e-9) throw new Error(`Dispatch quantity exceeds the remaining order quantity plus tolerance. Maximum dispatch allowed is ${round3(d.remainingDispatchableHardCap)} kg.`);
    if(qty > d.availableFinalAcceptedNotDispatched + 1e-9) throw new Error(`Only ${round3(d.availableFinalAcceptedNotDispatched)} kg of Final-QC-accepted stock is currently available to dispatch.`);
    const prevStatus = deriveItemStatus(wo);
    const reelsType = wo.packagingType || '';
    wo.dispatchEntries.push({id:uid('DSP'), qty, docNo:f.docNo, reelsCount:Number(f.reelsCount), reelsType, timestamp:nowIso(), by:currentUser().fullName});
    const newStatus = deriveItemStatus(wo);
    logItemActivity(wo, 'Dispatched', prevStatus, newStatus, qty, currentUser().fullName, `Invoice ${f.docNo} · ${f.reelsCount} reel(s)/basket(s)${reelsType?' · '+reelsType:''}`);
    logOrderAudit(order, `Dispatch recorded on ${wo.itemSerialNo}: ${qty} kg`);
    await saveOrder(order.id); state.modal=null; showToast(`Dispatch recorded (${qty} kg).`); render();
  }

  // Contact fields are only shown in the form to privileged roles, so a non-privileged user's
  // edit submission simply won't include those keys at all — we must preserve whatever the
  // record already had for them, never treat "not in this form" as "clear it out."
  // Renders one Reel Type's block for the Client/Sales-Order reel-rate editor — every size that
  // type offers, each with its own rate input (never one common rate for a whole type).
  function reelTypeSectionHtml(type, ratesForType){
    const sizes = PACKAGING_REEL_SIZES[type] || ['SP'];
    return `<div class="reel-type-section" data-reel-type="${esc(type)}" style="border:1px solid var(--line); border-radius:6px; padding:7px 9px; margin-bottom:7px;">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:5px;">
        <b style="font-size:11px;">${esc(type)}</b>
        <button type="button" class="btn btn-ghost btn-sm reel-type-remove" style="color:var(--red); padding:2px 6px;">Remove</button>
      </div>
      <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(105px,1fr)); gap:5px;">
        ${sizes.map(s=>{
          const existing = ratesForType.find(x=>x.reelSize===s);
          return `<div style="display:flex; align-items:center; gap:4px;">
            <span class="mono" style="font-size:9.5px; min-width:32px;">${esc(s)}</span>
            <input type="number" min="0" step="0.01" class="reel-size-rate-input" data-size="${esc(s)}" placeholder="₹/reel" value="${existing&&existing.depositFeePerReel!=null?existing.depositFeePerReel:''}" style="flex:1;">
          </div>`;
        }).join('')}
      </div>
    </div>`;
  }
  function readReelMakesFromDom(){
    const sections = document.querySelectorAll('#reelMakesRows .reel-type-section');
    const makes = [];
    sections.forEach(section=>{
      const type = section.getAttribute('data-reel-type');
      section.querySelectorAll('.reel-size-rate-input').forEach(input=>{
        if(!input.value) return; // only sizes the user actually priced are saved
        makes.push({ reelMake: type, reelSize: input.getAttribute('data-size'), depositFeePerReel: Number(input.value) });
      });
    });
    return makes;
  }
  // Reads the Sales Order form's own current values (not a Client's) — used both for the plain
  // "stash before opening a sub-modal" case and as the base that fetchClientCommercialTerms()
  // below layers auto-fetched values on top of.
  function readSOFieldsFromForm(){
    const f = readForm('formSalesOrder');
    return {
      customer:f.customer||'', poNumber:f.poNumber||'', poDate:f.poDate||'', paymentTerms:f.paymentTerms||'',
      reelsDepositFeeApplicable: f.reelsDepositFeeApplicable==='yes',
      reelMakes: f.reelsDepositFeeApplicable==='yes' ? readReelMakesFromDom() : [],
      packagingSheetDepositApplicable: f.packagingSheetDepositApplicable==='yes',
      packagingSheetPrice: f.packagingSheetDepositApplicable==='yes' && f.packagingSheetPrice ? Number(f.packagingSheetPrice) : null,
    };
  }
  // Looks up a Client by exact name (case/whitespace-insensitive) and returns its commercial
  // terms as a plain snapshot object — the caller is responsible for actually copying these into
  // a Sales Order; this function itself never mutates anything, so it's safe to call just to
  // check whether a match exists.
  function fetchClientCommercialTerms(customerName){
    const name = (customerName||'').trim().toLowerCase();
    if(!name) return null;
    const client = state.clients.find(c=>(c.clientName||'').trim().toLowerCase()===name);
    if(!client) return null;
    return {
      paymentTerms: client.paymentTerms||'',
      reelsDepositFeeApplicable: !!client.reelsDepositFeeApplicable,
      reelMakes: JSON.parse(JSON.stringify(client.reelMakes||[])),
      packagingSheetDepositApplicable: !!client.packagingSheetDepositApplicable,
      packagingSheetPrice: client.packagingSheetPrice!=null ? client.packagingSheetPrice : null,
    };
  }
  // For an item's own Packaging Type, looks up the matching per-reel deposit rate from the
  // Client's terms as they were fetched onto this item's parent Sales Order — never queries the
  // Client record directly, so this always reflects the rate that was actually agreed for this
  // specific order, not whatever the Client's record says today.
  function fetchReelsDepositRateFromClient(order, packagingType, reelSize){
    if(!order || !order.salesOrderId || !packagingType) return null;
    const so = state.salesOrders.find(s=>s.id===order.salesOrderId);
    if(!so || !so.reelsDepositFeeApplicable) return null;
    const match = (so.reelMakes||[]).find(m=>m.reelMake===packagingType && (!reelSize || m.reelSize===reelSize));
    return match && match.depositFeePerReel!=null ? match.depositFeePerReel : null;
  }
  async function submitCreateClient(){

    if(!f.clientName) throw new Error('Client Name is required.');
    const sup = mkClient({
      clientName:f.clientName, billToAddress:f.billToAddress, shipToAddress:f.shipToAddress,
      gstNumber:f.gstNumber, panNumber:f.panNumber, ownershipType:f.ownershipType, ownershipTypeOther:f.ownershipType==='Others'?f.ownershipTypeOther:'',
      contactName:f.contactName, contactNumber:f.contactNumber, contactEmail:f.contactEmail,
      plantContactName:f.plantContactName, plantContactNumber:f.plantContactNumber, plantContactEmail:f.plantContactEmail,
      qcContactName:f.qcContactName, qcContactNumber:f.qcContactNumber, qcContactEmail:f.qcContactEmail,
      paymentTerms:f.paymentTerms,
      reelsDepositFeeApplicable: f.reelsDepositFeeApplicable==='yes',
      reelMakes: f.reelsDepositFeeApplicable==='yes' ? readReelMakesFromDom() : [],
      packagingSheetDepositApplicable: f.packagingSheetDepositApplicable==='yes',

  async function submitEditClient(){
    const sup = state.clients.find(x=>x.id===state.modal.clientId);

    if(!f.clientName) throw new Error('Client Name is required.');
